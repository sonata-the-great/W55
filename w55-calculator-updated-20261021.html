<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <title>W55 Aluminium Calculator</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
/* =====================================================================
   THEMES — exactly seven. Every colour used by the UI comes from these
   variables, so switching [data-theme] restyles the whole app (cards,
   inputs, buttons, drawing canvas, results, modals) and nothing else.
   Selected via body[data-theme]; list is mirrored in the THEMES array (JS).
   ===================================================================== */
:root,
[data-theme="light"]{
color-scheme:light;
--bg:#F2F2F7; --card:rgba(255,255,255,0.82); --card2:rgba(255,255,255,0.97);
--border:rgba(60,60,67,0.18); --text:#111114; --sub:rgba(40,40,48,0.72);
--input:rgba(118,118,128,0.12);
--accent:#0A5FD0; --accentText:#ffffff; --accent-soft:rgba(10,95,208,0.12); --accent-sel:rgba(10,95,208,0.24); --accent-glow:0 4px 12px rgba(10,95,208,0.3);
--danger:#C62828; --danger-soft:rgba(198,40,40,0.12);
--success:#1B7F3B; --successText:#ffffff;
--shadow:0 10px 25px rgba(0,0,0,0.06); --radius:16px;
--sticky-bg:rgba(242,242,247,0.9); --topbar-bg:rgba(249,249,249,0.85);
--option-bg:#ffffff; --divider-bg:rgba(10,95,208,0.07); --canvas-bg:rgba(120,120,128,0.08);
--cell-fill:rgba(127,127,127,0.04); --overlay:rgba(0,0,0,0.55);
}
[data-theme="dark"]{
color-scheme:dark;
--bg:#000000; --card:rgba(28,28,30,0.78); --card2:rgba(44,44,46,0.96);
--border:rgba(255,255,255,0.14); --text:#ffffff; --sub:rgba(235,235,245,0.68);
--input:rgba(120,120,128,0.28);
--accent:#4DA3FF; --accentText:#04172E; --accent-soft:rgba(77,163,255,0.16); --accent-sel:rgba(77,163,255,0.3); --accent-glow:0 4px 12px rgba(77,163,255,0.28);
--danger:#FF6B61; --danger-soft:rgba(255,107,97,0.16);
--success:#30D158; --successText:#04210E;
--shadow:0 12px 30px rgba(0,0,0,0.4);
--sticky-bg:rgba(0,0,0,0.8); --topbar-bg:rgba(20,20,20,0.75);
--option-bg:#2c2c2e; --divider-bg:rgba(255,255,255,0.06); --canvas-bg:rgba(255,255,255,0.05);
--cell-fill:rgba(255,255,255,0.03); --overlay:rgba(0,0,0,0.7);
}
[data-theme="ocean"]{
color-scheme:dark;
--bg:#071A2E; --card:rgba(14,42,71,0.9); --card2:#153A60;
--border:rgba(140,190,255,0.22); --text:#EAF4FF; --sub:#A9C4DF;
--input:rgba(120,175,240,0.16);
--accent:#38BDF8; --accentText:#03202F; --accent-soft:rgba(56,189,248,0.16); --accent-sel:rgba(56,189,248,0.3); --accent-glow:0 4px 12px rgba(56,189,248,0.28);
--danger:#FF8A80; --danger-soft:rgba(255,138,128,0.16);
--success:#34D399; --successText:#022C1E;
--shadow:0 12px 30px rgba(0,10,30,0.45);
--sticky-bg:rgba(7,26,46,0.88); --topbar-bg:rgba(7,26,46,0.82);
--option-bg:#0E2A47; --divider-bg:rgba(56,189,248,0.08); --canvas-bg:rgba(120,175,240,0.08);
--cell-fill:rgba(120,175,240,0.04); --overlay:rgba(2,10,22,0.72);
}
[data-theme="forest"]{
color-scheme:dark;
--bg:#0A1A11; --card:rgba(20,41,29,0.9); --card2:#1C3828;
--border:rgba(150,230,180,0.22); --text:#EAF6EE; --sub:#A7C7B2;
--input:rgba(130,210,160,0.14);
--accent:#4ADE80; --accentText:#052E16; --accent-soft:rgba(74,222,128,0.15); --accent-sel:rgba(74,222,128,0.28); --accent-glow:0 4px 12px rgba(74,222,128,0.26);
--danger:#FF8A80; --danger-soft:rgba(255,138,128,0.16);
--success:#86EFAC; --successText:#052E16;
--shadow:0 12px 30px rgba(0,15,5,0.45);
--sticky-bg:rgba(10,26,17,0.88); --topbar-bg:rgba(10,26,17,0.82);
--option-bg:#14291D; --divider-bg:rgba(74,222,128,0.08); --canvas-bg:rgba(130,210,160,0.07);
--cell-fill:rgba(130,210,160,0.04); --overlay:rgba(2,12,6,0.72);
}
[data-theme="sunset"]{
color-scheme:light;
--bg:#FFF1E2; --card:rgba(255,255,255,0.88); --card2:#FFFFFF;
--border:rgba(120,60,20,0.22); --text:#3B1F10; --sub:#6F4A36;
--input:rgba(194,65,12,0.08);
--accent:#B83A08; --accentText:#ffffff; --accent-soft:rgba(184,58,8,0.11); --accent-sel:rgba(184,58,8,0.22); --accent-glow:0 4px 12px rgba(184,58,8,0.28);
--danger:#B91C1C; --danger-soft:rgba(185,28,28,0.11);
--success:#1E7B34; --successText:#ffffff;
--shadow:0 10px 25px rgba(120,60,20,0.1);
--sticky-bg:rgba(255,241,226,0.92); --topbar-bg:rgba(255,246,236,0.88);
--option-bg:#ffffff; --divider-bg:rgba(184,58,8,0.07); --canvas-bg:rgba(194,65,12,0.06);
--cell-fill:rgba(194,65,12,0.03); --overlay:rgba(59,31,16,0.55);
}
[data-theme="violet"]{
color-scheme:dark;
--bg:#150A22; --card:rgba(36,20,54,0.9); --card2:#2E1B46;
--border:rgba(200,160,255,0.22); --text:#F5ECFF; --sub:#C9B6DE;
--input:rgba(190,140,255,0.14);
--accent:#C792FF; --accentText:#2A0B49; --accent-soft:rgba(199,146,255,0.16); --accent-sel:rgba(199,146,255,0.3); --accent-glow:0 4px 12px rgba(199,146,255,0.26);
--danger:#FF8FA3; --danger-soft:rgba(255,143,163,0.16);
--success:#7EE0A3; --successText:#052E16;
--shadow:0 12px 30px rgba(10,0,25,0.5);
--sticky-bg:rgba(21,10,34,0.88); --topbar-bg:rgba(21,10,34,0.82);
--option-bg:#241436; --divider-bg:rgba(199,146,255,0.08); --canvas-bg:rgba(190,140,255,0.07);
--cell-fill:rgba(190,140,255,0.04); --overlay:rgba(10,3,20,0.74);
}
[data-theme="slate"]{
color-scheme:light;
--bg:#E6ECF1; --card:rgba(255,255,255,0.9); --card2:#FFFFFF;
--border:rgba(30,50,70,0.2); --text:#1B2733; --sub:#4C5B69;
--input:rgba(40,70,100,0.08);
--accent:#0B6B63; --accentText:#ffffff; --accent-soft:rgba(11,107,99,0.11); --accent-sel:rgba(11,107,99,0.22); --accent-glow:0 4px 12px rgba(11,107,99,0.28);
--danger:#B42318; --danger-soft:rgba(180,35,24,0.1);
--success:#1B7F3B; --successText:#ffffff;
--shadow:0 10px 25px rgba(30,50,70,0.1);
--sticky-bg:rgba(230,236,241,0.92); --topbar-bg:rgba(240,244,247,0.88);
--option-bg:#ffffff; --divider-bg:rgba(11,107,99,0.07); --canvas-bg:rgba(40,70,100,0.06);
--cell-fill:rgba(40,70,100,0.03); --overlay:rgba(20,35,50,0.55);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}

body{
min-height:100vh;
color:var(--text);
display:flex;
justify-content:center;
padding:0;
background:var(--bg);
transition:background 0.3s ease;
-webkit-font-smoothing:antialiased;
}

.app-container{
width:100%;
max-width:440px;
min-height:100vh;
display:flex;
flex-direction:column;
background:transparent;
position:relative;
padding-bottom:20px;
}

.top-bar{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
padding:14px 20px;
position:sticky;
top:0;
z-index:30;
background:var(--topbar-bg);
border-bottom:0.5px solid var(--border);
backdrop-filter:blur(20px) saturate(180%);
}

.brand-title{
font-size:17px;
font-weight:600;
letter-spacing:-0.4px;
color:var(--text);
cursor:pointer;
user-select:none;
}

.admin-badge {
  font-size: 10px;
  background: var(--accent);
  color: var(--accentText);
  padding: 2px 6px;
  border-radius: 6px;
  margin-left: 6px;
  vertical-align: middle;
  display: none;
}

.top-unit-select{width:70px;height:32px;flex:0 0 70px;padding:4px 5px;border-radius:10px;font-size:12px;font-weight:600;background:var(--input);color:var(--text);text-align:center;}
.settings-btn{
width:32px;
height:32px;
border-radius:50%;
border:none;
background:var(--input);
color:var(--accent);
font-size:16px;
display:flex;
align-items:center;
justify-content:center;
font-weight:600;
}

.content-area{padding:16px;flex:1}

.back-nav-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--sticky-bg);
  border: none;
  border-bottom: 0.5px solid var(--border);
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 10px 16px;
  margin: -16px -16px 14px -16px;
  position: sticky;
  top: 49px;
  z-index: 25;
  backdrop-filter: blur(20px) saturate(180%);
}

.card{
background:var(--card);
border:0.5px solid var(--border);
border-radius:var(--radius);
padding:16px;
margin-bottom:16px;
box-shadow:var(--shadow);
backdrop-filter:blur(30px) saturate(190%);
}

.card-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.item-label{
font-size:12px;
font-weight:600;
color:var(--sub);
text-transform:uppercase;
}

.card-delete-btn{
width:26px;
height:26px;
border-radius:50%;
border:none;
background:var(--danger-soft);
color:var(--danger);
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

.grid-3{display:grid;grid-template-columns:1fr 1fr .8fr;gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.input-wrapper{display:flex;flex-direction:column}
.input-wrapper label{
font-size:11px;
font-weight:500;
color:var(--sub);
margin:0 0 6px 2px;
text-transform:uppercase;
}

input,select{
width:100%;
height:40px;
background:var(--input);
border:none;
border-radius:10px;
color:var(--text);
padding:8px 12px;
font-size:14px;
text-align:center;
outline:none;
-webkit-appearance:none;
appearance:none;
font-weight:400;
}

input:disabled { opacity: 0.6; cursor: not-allowed; }
input::placeholder{color:var(--sub);opacity:0.8}
input:focus,select:focus{box-shadow:0 0 0 2px var(--accent);}

select option{background:var(--option-bg);color:var(--text)}

.btn-row{display:flex;gap:10px;margin-top:6px}

/* ---------- Buttons: one shared system (hover / focus / active / disabled) ---------- */
button{
cursor:pointer;
border:none;
border-radius:12px;
font-weight:600;
font-size:14px;
padding:12px;
transition:transform .12s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
/* press feedback: pure CSS, so it can never delay or block the click itself */
button:not(:disabled):active{transform:scale(.95)}
button.clicked-feedback:not(:disabled){animation:buttonTapFeedback .22s ease-out}
@keyframes buttonTapFeedback{0%{transform:scale(1);filter:brightness(1)}45%{transform:scale(.95);filter:brightness(.9)}100%{transform:scale(1);filter:brightness(1)}}
@media (hover:hover){
  button:not(:disabled):hover{filter:brightness(1.07)}
  .tool-btn:not(:disabled):hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  button:not(:disabled):active{transform:none}
}

.btn-blue{
width:48px;
font-size:20px;
padding:0;
color:var(--accent);
background:var(--input);
display:flex;
align-items:center;
justify-content:center;
}

.btn-dark{background:var(--input);color:var(--accent);flex:1;}

.btn-run{
width:100%;
margin-top:14px;
padding:14px;
border-radius:14px;
background:var(--accent);
color:var(--accentText);
font-size:15px;
font-weight:600;
box-shadow:var(--accent-glow);
}
.btn-success{background:var(--success);color:var(--successText);box-shadow:none}

.nav-btn{
background:var(--card);
border:0.5px solid var(--border);
border-radius:var(--radius);
padding:16px;
margin-bottom:16px;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
color:var(--text);
font-size:14px;
font-weight:600;
}

.screen{display:block}.hidden{display:none!important}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
th{
color:var(--sub);
border-bottom:0.5px solid var(--border);
padding:0 0 8px;
text-align:left;
font-size:11px;
font-weight:600;
text-transform:uppercase;
}
td{padding:12px 2px;border-bottom:0.5px solid var(--border)}
.clickable-row{cursor:pointer}
.clickable-row:active{opacity:0.6}
.text-right{text-align:right}
.highlight-qty{color:var(--accent);font-weight:600}

.section-divider{
  background:var(--divider-bg);
  font-weight:600;
  color:var(--accent);
  font-size:12px;
  text-transform:uppercase;
}
.section-divider td{padding:8px 6px;border-bottom:1px solid var(--border)}

.btn-action-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn-action{
background:var(--input);
border:none;
color:var(--accent);
padding:12px;
border-radius:12px;
font-size:13px;
font-weight:500;
}

.tab-header{
display:flex;
gap:2px;
padding:2px;
background:var(--input);
border-radius:9px;
margin-bottom:14px;
}
.tab-btn{
flex:1;
padding:7px;
background:transparent;
color:var(--sub);
border:none;
font-size:12px;
font-weight:500;
border-radius:7px;
}
.tab-btn.active{color:var(--text);background:var(--card2);font-weight:600;}

.swiper-container{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.swiper-container::-webkit-scrollbar{display:none}
.swipe-page{flex:0 0 100%;scroll-snap-align:start;width:100%}

.bar-container{
background:var(--input);
border-radius:8px;
height:34px;
width:100%;
display:flex;
overflow:hidden;
margin-bottom:8px;
}
.bar-piece{
height:100%;
background:var(--accent);
border-right:1px solid var(--bg);
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
color:var(--accentText);
font-weight:600;
padding:0 2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.bar-waste{
background:var(--danger-soft);
color:var(--text);
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
flex:1;
font-weight:500;
}

.drawing-preview-box {
  margin-top: 10px;
  width: 100%;
  height: 50px;
  background: var(--input);
  border: 1.5px dashed var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.drawing-preview-box:active { opacity: 0.7; }
.draw-placeholder-text {
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
}
.mini-canvas-preview {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
}

/* Canvas & Selection UI */
.canvas-workspace {
  width: 100%;
  height: 310px;
  background: var(--canvas-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  position: relative;
  margin-bottom: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tool-btn-group {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.tool-btn-group.five { grid-template-columns: repeat(5, 1fr); }
/* Every drawing tool button (Fixed ... Reset, incl. Connect) shares this one style. */
.tool-btn {
  padding: 9px 2px;
  min-height: 36px;
  font-size: 11px;
  background: var(--input);
  color: var(--text);
  border-radius: 8px;
  text-align: center;
  font-weight: 600;
}
.tool-btn.danger { color: var(--danger); }

/* Interactive SVG classes */
.cell-rect {
  fill: var(--cell-fill);
  stroke: transparent;
  cursor: pointer;
  transition: fill 0.15s ease;
}
.cell-rect:hover { fill: var(--accent-soft); }
.cell-rect.selected {
  fill: var(--accent-sel) !important;
  stroke: var(--accent) !important;
  stroke-width: 1.5;
}
/* A logical line segment is one <g class="seg">: the visible line + a wider invisible tap target. */
.mullion-line { stroke: var(--text); stroke-width: 3; pointer-events: none; transition: stroke 0.15s ease; }
.cell-symbol { pointer-events: none; }
.hit-line { stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
.seg:hover .mullion-line { stroke: var(--accent); }
.seg.selected .mullion-line { stroke: var(--danger); stroke-width: 4; }

/* Themed message line used by the drawing tools */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);max-width:90%;background:var(--card2);color:var(--text);border:.5px solid var(--border);box-shadow:var(--shadow);padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:200;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.list-item-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border);font-size:13px}
#settings-screen .card select,#settings-screen .card input, #pricing-screen .card input{text-align:left}

.modal-overlay {
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background: var(--overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.modal-box {
  background: var(--card2);
  border: 0.5px solid var(--border);
  padding: 20px;
  border-radius: var(--radius);
  width: 90%;
  max-width: 340px;
}
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; text-align: center; }

/* Cutting diagrams / result notes */
.bar-container .bar-piece{flex:none}
.bar-kerf{flex:none;min-width:1px;height:100%;background:var(--danger)}
.bar-offcut{flex:none}
.bar-reuse{background:var(--accent-soft);outline:1.5px dashed var(--success);outline-offset:-2px;color:var(--text)}
.diag-meta{font-size:11px;color:var(--sub);margin:3px 0 8px;line-height:1.5;overflow-wrap:anywhere}
.diag-warn{font-size:12px;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:8px 10px;margin-bottom:8px;line-height:1.4}
.sub-note{display:block;font-size:11px;color:var(--sub);font-weight:400}
.warn-row td{color:var(--danger);font-size:12px;padding-top:2px}
</style>
</head>
<body data-theme="light">

<div class="app-container">
  
  <div class="top-bar">
    <div class="brand-title" onclick="handleBrandClick()">
      W55 Calculator <span id="admin-badge" class="admin-badge">ADMIN</span>
    </div>
    <select id="global-unit" class="top-unit-select" onchange="convertAllUnits()" aria-label="Measurement unit" title="Measurement Unit"><option value="feet">ft/in</option><option value="mm">mm</option></select>
    <button class="settings-btn" id="settings-toggle-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>

  <div class="content-area">
    
    <!-- Input Screen -->
    <div id="input-screen" class="screen">
      <div id="item-list"></div>

      <div class="btn-row">
        <button class="btn-blue" onclick="addItem()">+</button>
        <button class="btn-dark" onclick="clearAll()">Clear All</button>
      </div>

      <button class="btn-run" onclick="calculateCutList()">Run Calculation</button>
    </div>

    <!-- Drawing Screen -->
    <div id="drawing-screen" class="screen hidden">
      <button class="back-nav-btn" onclick="closeDrawingScreen()">← Back</button>

  const profileItemsList = ['Outer Frame', 'Mullion', 'Click', 'Sash Profile'];

  function loadPricingFromCloud() {
    if (!db) return Promise.resolve();

  function savePricingToCloud() {
    if (!isAdmin || !db) return;

    });

      }

      .then(() => alert("Pricing successfully saved to Cloud."))
      .catch(err => alert("Failed: " + err.message));

  let itemCount = 0, currentUnit = 'feet';
  let currentActiveCardId = null;
  let cardDrawings = {};

  // Selection state. selectedCells holds ONE id per logical cell (the top-left "anchor" cell of a
  // merged group); selectedSegments holds segment ids (a connected line is always selected whole).
  let selectedCells = [];
  let selectedSegments = [];
  let drawingUndoStacks = {};
  let drawingRedoStacks = {};
  let calculatedProfileData = {}, calculatedAccessoriesData = {};

  // Brief visual feedback for taps/clicks on every enabled button (CSS handles reduced-motion).
  document.addEventListener('click', function(event) {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    button.classList.remove('clicked-feedback');
    void button.offsetWidth;
    button.classList.add('clicked-feedback');
    setTimeout(() => button.classList.remove('clicked-feedback'), 240);
  });

  function formatFeetInches(totalInches) {
    if (totalInches == null || isNaN(totalInches)) return '';
    totalInches = Math.max(0, Number(totalInches));
    let sixteenths = Math.round(totalInches * 16);
    let feet = Math.floor(sixteenths / 192);
    let rem16 = sixteenths - feet * 192;
    let wholeInches = Math.floor(rem16 / 16);
    let frac16 = rem16 % 16;
    const fracMap = {1:'1/16',2:'1/8',3:'3/16',4:'1/4',5:'5/16',6:'3/8',7:'7/16',8:'1/2',9:'9/16',10:'5/8',11:'11/16',12:'3/4',13:'13/16',14:'7/8',15:'15/16'};
    let out = '';
    if (feet > 0) out += feet + "'";
    if (wholeInches > 0 || frac16 > 0) {
      if (out) out += '-';
      out += wholeInches;
      if (frac16 > 0) out += ' ' + fracMap[frac16];
      out += '"';
    }
    return out || (totalInches === 0 ? '0"' : '');
  }

  function parseFraction(str) {
    str = String(str || '').trim();
    if (!str) return 0;
    if (str.includes('/')) {
      const p = str.split('/');
      const a = parseFloat(p[0]), b = parseFloat(p[1]);
      return (isFinite(a) && isFinite(b) && b !== 0) ? a / b : 0;
    }
    const n = parseFloat(str);
    return isFinite(n) ? n : 0;
  }

  function parseToInches(valStr, unit = currentUnit) {
    if (valStr == null || String(valStr).trim() === '') return 0;
    let s = String(valStr).trim().toLowerCase().replace(/,/g, '');
    if (unit === 'mm') {
      const n = parseFloat(s.replace(/mm/g, '').trim());
      return isFinite(n) ? n / 25.4 : 0;
    }
    let total = 0;
    const feetMatch = s.match(/^\s*(-?\d+(?:\.\d+)?)\s*'/);
    if (feetMatch) {
      total += parseFloat(feetMatch[1]) * 12;
      s = s.slice(feetMatch[0].length).trim();
    }
    s = s.replace(/"/g, '').replace(/-/g, ' ').trim();
    if (s) {
      const parts = s.split(/\s+/);
      // A bare fraction such as 1/8" must be read as 0.125, not as parseFloat('1/8') = 1.
      total += parts[0].includes('/') ? parseFraction(parts[0]) : (parseFloat(parts[0]) || 0);
      if (parts[1]) total += parseFraction(parts[1]);
    }
    return Math.max(0, total);
  }

  function displayLength(inches) {
    if (inches === 0) return '0';
    return currentUnit === 'mm' ? (Math.round(inches * 25.4 * 100) / 100) + ' mm' : formatFeetInches(inches);
  }

  function handleInchInput(input) {
    const raw = (input.value || '').trim();
    // Empty text or a placeholder-like "-" (no digits) is never a number: leave the field truly empty.
    if (raw === '' || !/\d/.test(raw)) { input.value = ''; delete input.dataset.inches; return; }
    const inches = parseToInches(raw, currentUnit);
    const isFrameSize = input.classList.contains('door-h') || input.classList.contains('door-w');
    if (isFrameSize && !(inches > 0)) { input.value = ''; delete input.dataset.inches; return; }   // 0 is not a size
    input.dataset.inches = String(inches);
    input.value = displayLength(inches);
  }

  function convertAllUnits() {
    const newUnit = document.getElementById('global-unit').value;
    if (newUnit === currentUnit) return;

      if (!isNaN(inches) && inches > 0) {
        field.dataset.inches = String(inches);
        field.value = newUnit === 'mm' ? (Math.round(inches * 25.4 * 100) / 100) + ' mm' : formatFeetInches(inches);
      }
    });
    currentUnit = newUnit;
  }

  function getKerfInches() {
    let input = document.getElementById('global-kerf');
    let inches = parseFloat(input.dataset.inches) || parseToInches(input.value || 0, currentUnit);
    return isNaN(inches) ? 0 : inches;

  function addItem() {

  // =====================================================================
  //  DRAWING DATA MODEL
  //
  //  The drawing is a grid: `vLines` vertical and `hLines` horizontal lines
  //  make (hLines+1) x (vLines+1) cells with ids  cell_<row>_<col>.
  //  Every stretch of a line BETWEEN two adjacent crossings is its own
  //  segment and stays independent by default:
  //     vseg_<lineIndex 1..vLines>_<row 0..hLines>   (vertical)
  //     hseg_<lineIndex 1..hLines>_<col 0..vLines>   (horizontal)
  //
  //  Logical objects stored in the data (NOT just visual tricks):
  //   - connectedSegmentGroups : [[segId, segId, ...], ...]
  //       Each group is one logical line: same axis, same line, directly
  //       adjacent positions. Selection/render/calc treat it as ONE object.
  //   - mergedCellGroups       : [[cellId, ...], ...]
  //       Each group is one logical cell (a full rectangle of grid cells).
  //       Segments strictly inside it are inactive (not drawn, not counted).
  //   - deletedSegments        : { segId: true }   (only the Delete button writes here)
  //   - cellTypes / cellMirrors: per cell id (every cell of a merged group shares one value)
  //
  //  normalizeDrawing() re-establishes these invariants after any edit.
  // =====================================================================
  const MAX_LINES = 20;
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function newDrawingData() {
    return {
      vLines: 0, hLines: 0, colDims: [], rowDims: [],
      cellTypes: {}, cellMirrors: {}, deletedSegments: {},
      connectedSegmentGroups: [], mergedCellGroups: []
    };
  }

  // Fills in any field an older/partial object might be missing.
  function ensureDrawingShape(d) {
    const base = newDrawingData();
    Object.keys(base).forEach(k => { if (d[k] === undefined || d[k] === null) d[k] = base[k]; });
    d.vLines = Math.max(0, parseInt(d.vLines, 10) || 0);
    d.hLines = Math.max(0, parseInt(d.hLines, 10) || 0);
    return d;
  }

  function cloneDrawingData(data) { return JSON.parse(JSON.stringify(data)); }

  function parseCellCoords(cellId) {
    const p = String(cellId).split('_');
    return { r: parseInt(p[1], 10), c: parseInt(p[2], 10) };
  }
  function parseSegId(id) {
    const m = /^([vh])seg_(\d+)_(\d+)$/.exec(String(id));
    return m ? { id: String(id), axis: m[1], line: +m[2], pos: +m[3] } : null;
  }
  function cellBounds(ids) {
    const co = ids.map(parseCellCoords);
    return {
      minR: Math.min(...co.map(x => x.r)), maxR: Math.max(...co.map(x => x.r)),
      minC: Math.min(...co.map(x => x.c)), maxC: Math.max(...co.map(x => x.c))
    };
  }
  function sortCellIds(ids) {
    return [...ids].sort((a, b) => {
      const A = parseCellCoords(a), B = parseCellCoords(b);
      return A.r - B.r || A.c - B.c;
    });
  }

  // Same type everywhere -> that type; mixed types -> Fixed.
  function regionType(data, cellIds) {
    const types = new Set(cellIds.map(id => data.cellTypes[id] || 'fixed'));
    return types.size === 1 ? [...types][0] : 'fixed';
  }
  function findMergedGroup(data, cellId) {
    return data.mergedCellGroups.find(g => g.includes(cellId)) || null;
  }
  // All grid cells that make up the logical cell containing `cellId`.
  function getRegionCells(data, cellId) {
    return findMergedGroup(data, cellId) || [cellId];
  }

  function isSegmentInRange(data, s) {
    return s.axis === 'v'
      ? (s.line >= 1 && s.line <= data.vLines && s.pos >= 0 && s.pos <= data.hLines)
      : (s.line >= 1 && s.line <= data.hLines && s.pos >= 0 && s.pos <= data.vLines);
  }
  // A segment strictly inside a merged cell is a removed internal boundary.
  function isSegmentInsideMergedCell(data, s) {
    return data.mergedCellGroups.some(g => {
      const b = cellBounds(g);
      return s.axis === 'v'
        ? (s.line > b.minC && s.line <= b.maxC && s.pos >= b.minR && s.pos <= b.maxR)
        : (s.line > b.minR && s.line <= b.maxR && s.pos >= b.minC && s.pos <= b.maxC);
    });
  }
  function isSegmentActive(data, segId) {
    const s = parseSegId(segId);
    return !!s && isSegmentInRange(data, s) && !data.deletedSegments[segId] && !isSegmentInsideMergedCell(data, s);
  }

  // Re-establish the data invariants (idempotent; safe to call any time).
  function normalizeDrawing(data) {
    ensureDrawingShape(data);
    const V = data.vLines, H = data.hLines;
    const cellOk = id => {
      const p = parseCellCoords(id);
      return Number.isInteger(p.r) && Number.isInteger(p.c) && p.r >= 0 && p.r <= H && p.c >= 0 && p.c <= V;
    };

    // 1) Merged cell groups must be in range, disjoint, and a FULL rectangle.
    const used = new Set(), groups = [];
    data.mergedCellGroups.forEach(g => {
      if (!Array.isArray(g)) return;
      const ids = [...new Set(g)];
      if (ids.length < 2 || !ids.every(cellOk) || ids.some(id => used.has(id))) return;
      const b = cellBounds(ids);
      if ((b.maxR - b.minR + 1) * (b.maxC - b.minC + 1) !== ids.length) return;
      ids.forEach(id => used.add(id));
      groups.push(sortCellIds(ids));
    });
    data.mergedCellGroups = groups;

    // 2) Drop stale per-cell / per-segment data that is outside the grid.
    Object.keys(data.cellTypes).forEach(id => { if (!cellOk(id)) delete data.cellTypes[id]; });
    Object.keys(data.cellMirrors).forEach(id => { if (!cellOk(id)) delete data.cellMirrors[id]; });
    Object.keys(data.deletedSegments).forEach(id => {
      const s = parseSegId(id);
      if (!s || !data.deletedSegments[id] || !isSegmentInRange(data, s)) delete data.deletedSegments[id];
    });

    // 3) One merged cell = one type (same -> kept, mixed -> Fixed) and one mirror flag.
    data.mergedCellGroups.forEach(g => {
      const type = regionType(data, g), mirror = !!data.cellMirrors[g[0]];
      g.forEach(id => { data.cellTypes[id] = type; data.cellMirrors[id] = mirror; });
    });

    // 4) Connected groups: keep only active members, and split into runs of directly
    //    adjacent segments. A run of 1 is just a normal independent segment again.
    const out = [], seen = new Set();
    data.connectedSegmentGroups.forEach(g => {
      if (!Array.isArray(g)) return;
      const buckets = {};
      [...new Set(g)].forEach(id => {
        const s = parseSegId(id);
        if (!s || seen.has(id) || !isSegmentActive(data, id)) return;
        const key = s.axis + s.line;
        (buckets[key] = buckets[key] || []).push(s);
      });
      Object.keys(buckets).forEach(key => {
        const list = buckets[key].sort((a, b) => a.pos - b.pos);
        let run = [];
        const flush = () => {
          if (run.length >= 2) { run.forEach(s => seen.add(s.id)); out.push(run.map(s => s.id)); }
          run = [];
        };
        list.forEach(s => {
          if (run.length && s.pos !== run[run.length - 1].pos + 1) flush();
          run.push(s);
        });
        flush();
      });
    });
    data.connectedSegmentGroups = out;
    return data;
  }

  // Section sizes. If they are missing, the wrong count, or no longer add up to the
  // frame size (user changed H/W after drawing), fit them to the frame proportionally.
  // Sizes the user typed (within the same 0.5" tolerance the dimension editor allows) are kept as typed.
  function fitDims(dims, count, total) {
    const ok = Array.isArray(dims) && dims.length === count && dims.every(d => isFinite(d) && d > 0);
    if (!ok) return Array(count).fill(total / count);
    const sum = dims.reduce((a, b) => a + b, 0);
    if (Math.abs(sum - total) <= 0.5) return dims.slice();
    return dims.map(d => d * total / sum);
  }

  // Logical cells ("regions"): every merged group is ONE region, every other cell is its own.
  function getRegions(data) {
    const regions = [], covered = new Set();
    data.mergedCellGroups.forEach(g => {
      const b = cellBounds(g), cells = [];
      for (let r = b.minR; r <= b.maxR; r++) for (let c = b.minC; c <= b.maxC; c++) cells.push(`cell_${r}_${c}`);
      cells.forEach(id => covered.add(id));
      regions.push({ anchor: `cell_${b.minR}_${b.minC}`, cells, merged: true, ...b });
    });
    for (let r = 0; r <= data.hLines; r++) {
      for (let c = 0; c <= data.vLines; c++) {
        const id = `cell_${r}_${c}`;
        if (!covered.has(id)) regions.push({ anchor: id, cells: [id], merged: false, minR: r, maxR: r, minC: c, maxC: c });
      }
    }
    regions.forEach(rg => { rg.type = regionType(data, rg.cells); rg.mirrored = !!data.cellMirrors[rg.anchor]; });
    return regions.sort((a, b) => a.minR - b.minR || a.minC - b.minC);
  }

  // Logical line objects: a connected group is ONE unit, every other active segment is its own unit.
  function getLogicalSegments(data) {
    const units = [], grouped = new Set();
    data.connectedSegmentGroups.forEach(g => {
      const segs = g.map(parseSegId).filter(s => s && isSegmentActive(data, s.id)).sort((a, b) => a.pos - b.pos);
      if (segs.length < 2) return;
      segs.forEach(s => grouped.add(s.id));
      units.push({ ids: segs.map(s => s.id), axis: segs[0].axis, line: segs[0].line,
                   first: segs[0].pos, last: segs[segs.length - 1].pos, connected: true });
    });
    for (let c = 1; c <= data.vLines; c++) for (let r = 0; r <= data.hLines; r++) {
      const id = `vseg_${c}_${r}`;
      if (!grouped.has(id) && isSegmentActive(data, id)) units.push({ ids: [id], axis: 'v', line: c, first: r, last: r, connected: false });
    }
    for (let r = 1; r <= data.hLines; r++) for (let c = 0; c <= data.vLines; c++) {
      const id = `hseg_${r}_${c}`;
      if (!grouped.has(id) && isSegmentActive(data, id)) units.push({ ids: [id], axis: 'h', line: r, first: c, last: c, connected: false });
    }
    return units;
  }
  // Total length of a logical line = sum of the sections it spans (2' + 2' = 4').
  function segmentLength(unit, colDims, rowDims) {
    let sum = 0;
    for (let p = unit.first; p <= unit.last; p++) sum += (unit.axis === 'v' ? rowDims[p] : colDims[p]) || 0;
    return sum;
  }

  // =====================================================================
  //  HISTORY (Undo / Redo) — one stack pair per window card.
  //  Every structural edit goes through runEdit(), which snapshots the
  //  whole drawing before the change and only records history when the
  //  drawing really changed. A new edit clears the redo stack.
  // =====================================================================
  function getActiveData() { return currentActiveCardId ? cardDrawings[currentActiveCardId] : null; }

  function runEdit(mutator) {
    const id = currentActiveCardId, data = cardDrawings[id];
    if (!data) return false;
    ensureDrawingShape(data); normalizeDrawing(data);
    const before = cloneDrawingData(data);
    let result;
    try { result = mutator(data); }
    catch (err) { console.error('Drawing edit failed, rolled back:', err); result = false; }
    if (result === false) {                       // invalid request: leave the drawing exactly as it was
      cardDrawings[id] = before;
      renderDrawing();
      return false;
    }
    normalizeDrawing(cardDrawings[id]);
    const changed = JSON.stringify(before) !== JSON.stringify(cardDrawings[id]);
    if (changed) {
      const stack = drawingUndoStacks[id] || (drawingUndoStacks[id] = []);
      stack.push(before);
      if (stack.length > 100) stack.shift();
      drawingRedoStacks[id] = [];                 // new edit after Undo clears Redo
    }
    renderDrawing();
    return changed;
  }

  function refreshHistoryButtons() {
    const id = currentActiveCardId;
    const undoBtn = document.getElementById('btn-undo'), redoBtn = document.getElementById('btn-redo');
    if (undoBtn) undoBtn.disabled = !(id && drawingUndoStacks[id] && drawingUndoStacks[id].length);
    if (redoBtn) redoBtn.disabled = !(id && drawingRedoStacks[id] && drawingRedoStacks[id].length);
  }

  function afterHistoryChange() {
    const d = cardDrawings[currentActiveCardId];
    selectedCells = [];
    selectedSegments = [];
    document.getElementById('v-lines-count').value = d.vLines || '';
    document.getElementById('h-lines-count').value = d.hLines || '';
    renderDrawing();
  }

  function undoDrawing() {
    const id = currentActiveCardId, undo = drawingUndoStacks[id];
    if (!id || !cardDrawings[id] || !undo || !undo.length) { refreshHistoryButtons(); return; }
    (drawingRedoStacks[id] = drawingRedoStacks[id] || []).push(cloneDrawingData(cardDrawings[id]));
    cardDrawings[id] = undo.pop();
    afterHistoryChange();
  }

  function redoDrawing() {
    const id = currentActiveCardId, redo = drawingRedoStacks[id];
    if (!id || !cardDrawings[id] || !redo || !redo.length) { refreshHistoryButtons(); return; }
    (drawingUndoStacks[id] = drawingUndoStacks[id] || []).push(cloneDrawingData(cardDrawings[id]));
    cardDrawings[id] = redo.pop();
    afterHistoryChange();
  }

  // Small themed message line (replaces blocking alert() inside the drawing tools).
  let toastTimer = null;
  function showMessage(text) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  // =====================================================================
  //  SCREEN / INPUT HANDLING
  // =====================================================================
  function openDrawingScreen(itemId) {
    const data = cardDrawings[itemId];
    if (!data) return;
    currentActiveCardId = itemId;
    ensureDrawingShape(data);
    document.getElementById('v-lines-count').value = data.vLines || '';
    document.getElementById('h-lines-count').value = data.hLines || '';
    selectedCells = [];
    selectedSegments = [];
    renderDrawing();
    document.getElementById('input-screen').classList.add('hidden');
    document.getElementById('drawing-screen').classList.remove('hidden');
  }

  function closeDrawingScreen() {
    document.getElementById('drawing-screen').classList.add('hidden');
    document.getElementById('input-screen').classList.remove('hidden');
  }

  // Blank / invalid / negative -> 0 lines. Placeholder "-" is never a value.
  function readLineCount(el) {
    const raw = el.value.trim();
    if (raw === '') return 0;
    const n = parseInt(raw, 10);
    return (isFinite(n) && n > 0) ? Math.min(n, MAX_LINES) : 0;
  }

  function onLineCountChange() {
    const vEl = document.getElementById('v-lines-count'), hEl = document.getElementById('h-lines-count');
    const v = readLineCount(vEl), h = readLineCount(hEl);
    if (vEl.value.trim() !== '') vEl.value = String(v);   // show the clamped value; blank stays blank
    if (hEl.value.trim() !== '') hEl.value = String(h);
    runEdit(d => {
      if (d.vLines === v && d.hLines === h) return false;
      d.vLines = v;
      d.hLines = h;
      d.colDims = [];          // section sizes restart as equal divisions of the frame
      d.rowDims = [];
      selectedCells = [];
      selectedSegments = [];
    });
  }

  // =====================================================================
  //  RENDERING
  // =====================================================================
  function svgEl(name, attrs) {
    const el = document.createElementNS(SVG_NS, name);
    Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
    return el;
  }

  function renderDrawing() {
    const svg = document.getElementById('drawing-svg');
    svg.innerHTML = '';
    const id = currentActiveCardId, data = cardDrawings[id];
    if (!data) { refreshHistoryButtons(); return; }
    ensureDrawingShape(data);
    normalizeDrawing(data);

    // Drop selections that no longer exist (after merge / delete / undo ...).
    const anchors = new Set(getRegions(data).map(r => r.anchor));
    selectedCells = selectedCells.filter(x => anchors.has(x));
    selectedSegments = selectedSegments.filter(x => isSegmentActive(data, x));

    const card = document.getElementById(id);
    const hInput = card?.querySelector('.door-h');
    const wInput = card?.querySelector('.door-w');
    const hInches = hInput && hInput.value.trim() !== '' ? (parseFloat(hInput.dataset.inches) || parseToInches(hInput.value, currentUnit) || 0) : 0;
    const wInches = wInput && wInput.value.trim() !== '' ? (parseFloat(wInput.dataset.inches) || parseToInches(wInput.value, currentUnit) || 0) : 0;

    // No valid Height AND Width -> clean, empty drawing area (no default rectangle, no phantom grid).
    if (!(hInches > 0 && wInches > 0)) { refreshHistoryButtons(); return; }

    const vCount = data.vLines, hCount = data.hLines;
    data.colDims = fitDims(data.colDims, vCount + 1, wInches);
    data.rowDims = fitDims(data.rowDims, hCount + 1, hInches);

    const maxW = 220, maxH = 180;
    const scale = Math.min(maxW / wInches, maxH / hInches);
    const boxW = wInches * scale, boxH = hInches * scale;
    const startX = 60 + (maxW - boxW) / 2;
    const startY = 30 + (maxH - boxH) / 2;

    const colX = [startX];
    data.colDims.forEach(d => colX.push(colX[colX.length - 1] + d * scale));
    const rowY = [startY];
    data.rowDims.forEach(d => rowY.push(rowY[rowY.length - 1] + d * scale));

    // Outer frame
    svg.appendChild(svgEl('rect', { x: startX, y: startY, width: boxW, height: boxH, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 4 }));

    // Cells: a merged group is drawn (and selected) as ONE rectangle.
    getRegions(data).forEach(rg => {
      const cellX = colX[rg.minC], cellY = rowY[rg.minR];
      const cellW = colX[rg.maxC + 1] - cellX, cellH = rowY[rg.maxR + 1] - cellY;
      const rect = svgEl('rect', { x: cellX, y: cellY, width: cellW, height: cellH,
        class: `cell-rect ${selectedCells.includes(rg.anchor) ? 'selected' : ''}` });
      rect.onclick = e => { e.stopPropagation(); toggleSelectCell(rg.anchor); };
      rect.setAttribute('data-cell', rg.anchor);
      svg.appendChild(rect);

      if (rg.type === 'fixed') {
        svg.appendChild(svgEl('line', { x1: cellX, y1: cellY, x2: cellX + cellW, y2: cellY + cellH, stroke: 'var(--sub)', 'stroke-width': 1, class: 'cell-symbol' }));
        svg.appendChild(svgEl('line', { x1: cellX + cellW, y1: cellY, x2: cellX, y2: cellY + cellH, stroke: 'var(--sub)', 'stroke-width': 1, class: 'cell-symbol' }));
        const f = svgEl('text', { x: cellX + cellW - 10, y: cellY + cellH - 6, 'font-size': 11, 'font-weight': 'bold', fill: 'var(--accent)', class: 'cell-symbol' });
        f.textContent = 'F';
        svg.appendChild(f);
      } else if (rg.type === 'casement') {
        const x1 = rg.mirrored ? cellX + cellW : cellX, x2 = rg.mirrored ? cellX : cellX + cellW;
        svg.appendChild(svgEl('path', { d: `M ${x1} ${cellY} L ${x2} ${cellY + cellH / 2} L ${x1} ${cellY + cellH}`,
          stroke: 'var(--accent)', 'stroke-dasharray': '3,3', fill: 'none', class: 'cell-symbol' }));
      } else if (rg.type === 'awning') {
        const y1 = rg.mirrored ? cellY + cellH : cellY, y2 = rg.mirrored ? cellY : cellY + cellH;
        svg.appendChild(svgEl('path', { d: `M ${cellX} ${y1} L ${cellX + cellW / 2} ${y2} L ${cellX + cellW} ${y1}`,
          stroke: 'var(--accent)', 'stroke-dasharray': '3,3', fill: 'none', class: 'cell-symbol' }));
      }
    });

    // Lines: each LOGICAL segment is one SVG object (a connected group = one long line).
    const units = getLogicalSegments(data);
    units.forEach(u => {
      const selected = u.ids.every(sid => selectedSegments.includes(sid));
      const geo = u.axis === 'v'
        ? { x1: colX[u.line], y1: rowY[u.first], x2: colX[u.line], y2: rowY[u.last + 1] }
        : { x1: colX[u.first], y1: rowY[u.line], x2: colX[u.last + 1], y2: rowY[u.line] };
      const g = svgEl('g', { class: `seg ${selected ? 'selected' : ''}`, 'data-seg': u.ids.join(','), 'data-connected': u.connected ? '1' : '0' });
      g.appendChild(svgEl('line', { ...geo, class: 'mullion-line' }));
      g.appendChild(svgEl('line', { ...geo, class: 'hit-line' }));   // wider invisible tap target
      g.onclick = e => { e.stopPropagation(); toggleSelectSegment(u.ids[0]); };
      svg.appendChild(g);
    });
    // Length label for selected lines (shows e.g. 4' for two connected 2' segments).
    units.forEach(u => {
      if (!u.ids.every(sid => selectedSegments.includes(sid))) return;
      const len = displayLength(segmentLength(u, data.colDims, data.rowDims));
      const mx = u.axis === 'v' ? colX[u.line] + 6 : (colX[u.first] + colX[u.last + 1]) / 2;
      const my = u.axis === 'v' ? (rowY[u.first] + rowY[u.last + 1]) / 2 : rowY[u.line] - 6;
      const t = svgEl('text', { x: mx, y: my, 'font-size': 10, 'font-weight': 700, fill: 'var(--danger)',
        'text-anchor': u.axis === 'v' ? 'start' : 'middle', 'pointer-events': 'none' });
      t.textContent = len;
      svg.appendChild(t);
    });

    // Width dimensions on TOP
    for (let c = 0; c <= vCount; c++) {
      const text = svgEl('text', { x: colX[c] + (colX[c + 1] - colX[c]) / 2, y: startY - 10, 'font-size': 10,
        fill: 'var(--accent)', 'font-weight': 600, 'text-anchor': 'middle' });
      text.style.cursor = 'pointer';
      text.textContent = displayLength(data.colDims[c]);
      text.onclick = () => promptEditDimension('col', c, wInches);
      svg.appendChild(text);
    }
    // Height dimensions on LEFT
    for (let r = 0; r <= hCount; r++) {
      const text = svgEl('text', { x: startX - 10, y: rowY[r] + (rowY[r + 1] - rowY[r]) / 2 + 3, 'font-size': 10,
        fill: 'var(--accent)', 'font-weight': 600, 'text-anchor': 'end' });
      text.style.cursor = 'pointer';
      text.textContent = displayLength(data.rowDims[r]);
      text.onclick = () => promptEditDimension('row', r, hInches);
      svg.appendChild(text);
    }
    refreshHistoryButtons();
  }

  // =====================================================================
  //  SELECTION
  // =====================================================================
  function toggleSelectCell(cellId) {
    selectedSegments = [];
    const idx = selectedCells.indexOf(cellId);
    if (idx > -1) selectedCells.splice(idx, 1);
    else selectedCells.push(cellId);
    renderDrawing();
  }

  // Selecting any part of a connected line selects the WHOLE connected group.
  function toggleSelectSegment(segId) {
    selectedCells = [];
    const data = cardDrawings[currentActiveCardId];
    const group = data.connectedSegmentGroups.find(g => g.includes(segId)) || [segId];
    const allSelected = group.every(id => selectedSegments.includes(id));
    if (allSelected) selectedSegments = selectedSegments.filter(id => !group.includes(id));
    else group.forEach(id => { if (!selectedSegments.includes(id)) selectedSegments.push(id); });
    renderDrawing();
  }

  // =====================================================================
  //  EDIT ACTIONS
  // =====================================================================
  function setCellType(type) {
    if (!selectedCells.length) { showMessage('Select at least one cell first.'); return; }
    runEdit(d => {
      // A merged cell is one logical cell: the type goes to every grid cell inside it.
      selectedCells.forEach(anchor => getRegionCells(d, anchor).forEach(id => { d.cellTypes[id] = type; }));
    });
  }

  function toggleMirrorSelected() {
    if (!selectedCells.length) { showMessage('Select at least one cell to mirror.'); return; }
    runEdit(d => {
      selectedCells.forEach(anchor => {
        const cells = getRegionCells(d, anchor), next = !d.cellMirrors[cells[0]];
        cells.forEach(id => { d.cellMirrors[id] = next; });
      });
    });
  }

  function connectSelectedElements() {
    if (!getActiveData()) return;
    if (selectedCells.length >= 2) return connectCells();
    if (selectedSegments.length >= 2) return connectSegments();
    showMessage('Select at least 2 adjacent cells or 2 adjacent line segments to connect.');
  }

  // CELL CONNECT: merge a rectangular block of cells into ONE logical cell.
  // Only the internal boundaries disappear (they become inactive inside the merged group);
  // the outer perimeter and every unrelated line / cell are untouched.
  function connectCells() {
    runEdit(d => {
      const cellSet = new Set();
      selectedCells.forEach(a => getRegionCells(d, a).forEach(id => cellSet.add(id)));
      const ids = [...cellSet];
      const b = cellBounds(ids);
      if (ids.length < 2 || (b.maxR - b.minR + 1) * (b.maxC - b.minC + 1) !== ids.length) {
        showMessage('Select a complete block of adjacent cells (a rectangle) to merge.');
        return false;                                   // invalid -> drawing untouched
      }
      const type = regionType(d, ids);                  // same type kept; mixed types -> Fixed
      const cells = sortCellIds(ids);
      const mirror = !!d.cellMirrors[cells[0]];
      d.mergedCellGroups = d.mergedCellGroups.filter(g => !g.some(id => cellSet.has(id)));
      cells.forEach(id => { d.cellTypes[id] = type; d.cellMirrors[id] = mirror; });
      d.mergedCellGroups.push(cells);
      selectedCells = [cells[0]];
      selectedSegments = [];
    });
  }

  // LINE CONNECT: make the selected directly-adjacent, collinear segments ONE logical line.
  // Nothing is deleted or hidden; the segments are recorded as one group in the data.
  function connectSegments() {
    runEdit(d => {
      const chosen = [...new Set(selectedSegments)].map(parseSegId);
      if (chosen.some(s => !s || !isSegmentActive(d, s.id))) { showMessage('Some selected segments are no longer available.'); return false; }
      const axis = chosen[0].axis, line = chosen[0].line;
      if (!chosen.every(s => s.axis === axis && s.line === line)) {
        showMessage('Select segments on the same straight line. Perpendicular lines are never merged.');
        return false;
      }
      const idSet = new Set(chosen.map(s => s.id));
      d.connectedSegmentGroups.forEach(g => { if (g.some(id => idSet.has(id))) g.forEach(id => idSet.add(id)); });
      const segs = [...idSet].map(parseSegId).sort((a, b) => a.pos - b.pos);
      if (!segs.every((s, i) => i === 0 || s.pos === segs[i - 1].pos + 1)) {
        showMessage('Segments must be directly next to each other, with no gap between them.');
        return false;
      }
      if (d.connectedSegmentGroups.some(g => g.length === segs.length && g.every(id => idSet.has(id)))) {
        showMessage('Those segments are already connected.');
        return false;
      }
      d.connectedSegmentGroups = d.connectedSegmentGroups.filter(g => !g.some(id => idSet.has(id)));
      d.connectedSegmentGroups.push(segs.map(s => s.id));
      selectedSegments = segs.map(s => s.id);           // keep the new line selected so its total length shows
      selectedCells = [];
    });
  }

  function deleteSelectedElements() {
    if (!selectedSegments.length) { showMessage('Select one or more line segments to delete.'); return; }
    runEdit(d => {
      selectedSegments.forEach(segId => { d.deletedSegments[segId] = true; });   // a connected line is deleted as a whole
      selectedSegments = [];
    });
  }

  function promptEditDimension(dimType, index, totalMaxInches) {
    const data = cardDrawings[currentActiveCardId];
    const dims = dimType === 'col' ? data.colDims : data.rowDims;

    const input = prompt(`Enter custom dimensions for all ${dims.length} sections (comma separated, e.g. 4', 4', 4'):`, dims.map(d => displayLength(d)).join(', '));
    if (!input) return;
    const parts = input.split(',').map(s => parseToInches(s.trim(), currentUnit));
    if (parts.length !== dims.length) { showMessage(`Please enter exactly ${dims.length} values.`); return; }
    if (parts.some(p => isNaN(p) || p <= 0)) { alert('Invalid dimension values entered!'); return; }
    const sum = parts.reduce((a, b) => a + b, 0);
    if (Math.abs(sum - totalMaxInches) > 0.5) {
      alert(`Error: Total dimensions sum (${displayLength(sum)}) exceeds or does not match total frame size (${displayLength(totalMaxInches)})!`);
      return;
    }
    runEdit(d => { if (dimType === 'col') d.colDims = parts; else d.rowDims = parts; });
  }

  ];
  const THEME_STORAGE_KEY = 'w55-theme';

  // Only changes presentation (data-theme attribute); never touches drawing data or results.
  function applyTheme(id, persist) {
