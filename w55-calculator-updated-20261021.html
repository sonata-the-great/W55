  // =====================================================================
  //  CUTTING ENGINES (pure functions, no DOM access)
  //  Internal integer unit: 1/256 inch (UNITS_PER_INCH). Every length is rounded
  //  once on entry; all fitting/validation is then exact integer arithmetic.
  // =====================================================================
  const UNITS_PER_INCH = 256;
  const toUnits = inches => Math.round(Number(inches) * UNITS_PER_INCH);
  const fromUnits = u => u / UNITS_PER_INCH;

  // ---------------------------------------------------------------------
  //  1D aluminium engine
  //  Kerf model: a bar holding n pieces needs (n-1) saw cuts between them
  //  (the last piece ends at the bar end or is separated from the offcut by
  //  one more cut). So a bar is feasible  <=>  sum(pieces) + (n-1)*kerf <= L,
  //  which is the same as  sum(piece+kerf) <= L+kerf. The trailing cut that
  //  separates the last piece from an offcut is charged to the offcut side.
  // ---------------------------------------------------------------------
  function barLayout(pieces, L, kerf) {
    const n = pieces.length;
    let sum = 0;
    for (const p of pieces) sum += p;
    const inner = Math.max(0, n - 1) * kerf;
    const free = L - sum - inner;                       // >= 0 when valid
    const trailing = free > 0 ? Math.min(kerf, free) : 0;
    return { sum, kerfLoss: inner + trailing, offcut: free - trailing, free };
  }

  // Compare plans: fewer bars, then less stock length consumed (= less waste),
  // then larger concentration of offcuts (sum of squares; favours one long offcut).
  function planKey(bars, kerf) {
    let stock = 0, sq = 0;
    for (const b of bars) {
      stock += b.L;
      const o = barLayout(b.pieces, b.L, kerf).offcut;
      sq += o * o;
    }
    return { bars: bars.length, stock, sq };
  }
  function keyBetter(a, b) {
    if (a.bars !== b.bars) return a.bars < b.bars;
    if (a.stock !== b.stock) return a.stock < b.stock;
    return a.sq > b.sq;
  }

  function clonePlan(bars) { return bars.map(b => ({ L: b.L, pieces: b.pieces.slice() })); }

  // Fast heuristic: First/Best Fit Decreasing, picking stock for each new bar.
  function heuristic1D(pieces, stocks, kerf, mode) {
    const sorted = pieces.slice().sort((a, b) => b - a);
    const avail = stocks.map(s => s.qty);
    const bars = [];
    const unplaced = [];
    for (const p of sorted) {
      let bestIdx = -1, bestLeft = Infinity;
      for (let i = 0; i < bars.length; i++) {
        const b = bars[i];
        // free is "L - sum - (n-1)*kerf" for current bar. Adding a piece costs p + kerf.
        if (b.free - (p + kerf) >= 0) {
          const rem = b.free - (p + kerf);
          if (mode === 'first') { bestIdx = i; break; }
          if (rem < bestLeft) { bestLeft = rem; bestIdx = i; }
        }
      }
      if (bestIdx >= 0) {
        const b = bars[bestIdx];
        b.pieces.push(p); b.free -= (p + kerf);
        continue;
      }
      // open a new bar: smallest stock that fits (min waste), must have stock left
      let si = -1;
      for (let i = 0; i < stocks.length; i++) {
        if (avail[i] > 0 && stocks[i].length >= p && (si < 0 || stocks[i].length < stocks[si].length)) si = i;
      }
      if (si < 0) { unplaced.push(p); continue; }
      avail[si]--;
      bars.push({ L: stocks[si].length, si, pieces: [p], free: stocks[si].length - p });
    }
    return { bars: bars.map(b => ({ L: b.L, si: b.si, pieces: b.pieces })), unplaced };
  }

  // Local search: move / swap pieces between bars to empty a bar or concentrate offcuts.
  function improve1D(bars, kerf, budget) {
    let steps = 0;
    const fits = (pieces, L) => barLayout(pieces, L, kerf).free >= 0;
    let changed = true;
    while (changed && steps < budget) {
      changed = false;
      // order bars by used length ascending: try to dissolve the emptiest bars
      const order = bars.map((b, i) => i).sort((x, y) => barLayout(bars[x].pieces, bars[x].L, kerf).sum - barLayout(bars[y].pieces, bars[y].L, kerf).sum);
      for (const ai of order) {
        const A = bars[ai];
        if (!A || A.pieces.length === 0) continue;
        // (1) try to move ALL pieces of A into other bars
        const trial = bars.map(b => b.pieces.slice());
        let ok = true;
        for (const p of A.pieces.slice().sort((a, b) => b - a)) {
          let done = false;
          // best fit among other bars
          let bj = -1, bleft = Infinity;
          for (let j = 0; j < bars.length; j++) {
            if (j === ai || trial[j].length === 0) continue;
            const l = barLayout(trial[j].concat(p), bars[j].L, kerf).free;
            if (l >= 0 && l < bleft) { bleft = l; bj = j; }
          }
          steps++;
          if (bj >= 0) { trial[bj].push(p); done = true; }
          if (!done) { ok = false; break; }
        }
        if (ok) {
          for (let j = 0; j < bars.length; j++) if (j !== ai) bars[j].pieces = trial[j];
          bars.splice(ai, 1);
          changed = true;
          break;
        }
      }
      if (changed) continue;
      // (2) swaps that concentrate free space: move a piece from the bar with less free to the one with more
      for (let i = 0; i < bars.length && !changed && steps < budget; i++) {
        for (let j = 0; j < bars.length && !changed; j++) {
          if (i === j) continue;
          const fi = barLayout(bars[i].pieces, bars[i].L, kerf).free;
          const fj = barLayout(bars[j].pieces, bars[j].L, kerf).free;
          if (fi > fj) continue;                          // move from i (fuller free) to j only if it grows the larger hole... handled via sq below
          for (let a = 0; a < bars[i].pieces.length && !changed; a++) {
            for (let b = -1; b < bars[j].pieces.length && !changed; b++) {
              steps++;
              const pa = bars[i].pieces[a];
              const pb = b >= 0 ? bars[j].pieces[b] : null;
              const ni = bars[i].pieces.slice(); ni.splice(a, 1); if (pb != null) ni.push(pb);
              const nj = bars[j].pieces.slice(); if (pb != null) nj.splice(b, 1); nj.push(pa);
              if (!fits(ni, bars[i].L) || !fits(nj, bars[j].L)) continue;
              const oi = barLayout(ni, bars[i].L, kerf).offcut, oj = barLayout(nj, bars[j].L, kerf).offcut;
              const o0i = barLayout(bars[i].pieces, bars[i].L, kerf).offcut, o0j = barLayout(bars[j].pieces, bars[j].L, kerf).offcut;
              if (oi * oi + oj * oj > o0i * o0i + o0j * o0j) {
                bars[i].pieces = ni; bars[j].pieces = nj; changed = true;
              }
            }
          }
        }
      }
    }
    return bars;
  }

  // Exact search ("bin completion"): the bar that holds the largest remaining piece is filled
  // with maximal feasible sets of other pieces. Piece types carry multiplicities, so large
  // quantities of identical cuts stay cheap. Budget is a deterministic node count.
  function search1D(types, stocks, kerf, incumbent, lowerBoundBars, nodeBudget, timeCapMs) {
    // types: [{len, cnt}] sorted by len desc
    const T = types.length;
    const counts = types.map(t => t.cnt);
    const avail = stocks.map(s => s.qty);
    const maxL = Math.max(...stocks.map(s => s.length));
    let best = incumbent ? { bars: clonePlan(incumbent), key: planKey(incumbent, kerf) } : null;
    let nodes = 0, exhausted = true;
    const t0 = Date.now();
    const cur = [];
    const remainingTotal = () => { let s = 0; for (let i = 0; i < T; i++) s += counts[i] * types[i].len; return s; };
    const remainingCount = () => { let s = 0; for (let i = 0; i < T; i++) s += counts[i]; return s; };

    function rec(sumStock) {
      if (nodes >= nodeBudget || ((nodes & 255) === 0 && Date.now() - t0 > timeCapMs)) { exhausted = false; return; }
      nodes++;
      let first = -1;
      for (let i = 0; i < T; i++) if (counts[i] > 0) { first = i; break; }
      if (first < 0) {
        const key = planKey(cur, kerf);
        if (!best || keyBetter(key, best.key)) best = { bars: clonePlan(cur), key };
        return;
      }
      const remPieces = remainingTotal();
      const remSize = remPieces + remainingCount() * kerf;       // each piece costs len+kerf of (L+kerf) capacity
      const barsLB = cur.length + Math.max(1, Math.ceil(remSize / (maxL + kerf)));
      if (best) {
        if (barsLB > best.key.bars) return;
        if (barsLB === best.key.bars && sumStock + remPieces > best.key.stock) return;
        // already at the proven bar minimum: only a short search for a better offcut layout
        if (best.key.bars === lowerBoundBars && nodes > 3000) return;
      }
      for (let si = 0; si < stocks.length; si++) {
        if (avail[si] <= 0) continue;
        const L = stocks[si].length;
        if (types[first].len > L) continue;
        // enumerate maximal completions containing one piece of type `first`
        const cap = L + kerf - (types[first].len + kerf);
        counts[first]--;
        const comps = [];
        const pick = new Array(T).fill(0);
        let enumNodes = 0;
        (function gen(i, room, fill) {
          if (enumNodes++ > 4000) { exhausted = false; return; }
          if (i === T) {
            // maximality: no remaining piece fits
            for (let k = 0; k < T; k++) if (counts[k] - pick[k] > 0 && types[k].len + kerf <= room) return;
            comps.push({ pick: pick.slice(), fill });
            return;
          }
          const sz = types[i].len + kerf;
          const maxN = Math.min(counts[i], Math.floor(room / sz));
          for (let n = maxN; n >= 0; n--) {
            pick[i] = n;
            gen(i + 1, room - n * sz, fill + n * sz);
          }
          pick[i] = 0;
        })(first, cap, 0);
        comps.sort((a, b) => b.fill - a.fill);
        const limit = Math.min(comps.length, 6);
        if (comps.length > limit) exhausted = false;
        for (let c = 0; c < limit; c++) {
          const comp = comps[c];
          const pcs = [types[first].len];
          for (let k = 0; k < T; k++) { counts[k] -= comp.pick[k]; for (let q = 0; q < comp.pick[k]; q++) pcs.push(types[k].len); }
          avail[si]--;
          cur.push({ L, si, pieces: pcs });
          rec(sumStock + L);
          cur.pop();
          avail[si]++;
          for (let k = 0; k < T; k++) counts[k] += comp.pick[k];
          if (nodes >= nodeBudget) break;
        }
        counts[first]++;
        if (nodes >= nodeBudget) break;
      }
    }
    rec(0);
    return { best, exhausted, nodes };
  }

  // Public: plan one aluminium profile.
  //  cutsInches : array of lengths (inches)       stocksIn : [{length (inches), qty? (default unlimited)}]
  //  kerfInches : saw kerf (inches)               opts     : {minOffcut (inches), nodeBudget, timeCapMs}
  // Returns a plan whose `validation` was produced by validate1D (independent of the optimizer).
  function planAluminium(cutsInches, stocksIn, kerfInches, opts) {
    opts = opts || {};
    const kerf = Math.max(0, toUnits(kerfInches || 0));
    const stocks = (stocksIn || []).map(s => ({ length: toUnits(s.length), qty: (s.qty == null || s.qty === Infinity) ? Infinity : Math.max(0, Math.floor(s.qty)) }))
      .filter(s => s.length > 0).sort((a, b) => a.length - b.length);
    const all = (cutsInches || []).map(toUnits).filter(u => u > 0);
    const input = { cuts: all, stocks };
    const result = { ok: true, status: 'empty', bars: [], impossible: [], unplaced: [], kerfUnits: kerf, lowerBound: 0, proven: false };
    if (all.length === 0) { finalize1D(result, kerf, opts); result.validation = validate1D(result, input); return result; }
    if (stocks.length === 0) { result.ok = false; result.status = 'no-stock'; result.impossible = all.slice(); finalize1D(result, kerf, opts); result.validation = validate1D(result, input); return result; }

    const maxL = Math.max(...stocks.map(s => s.length));
    const pieces = [];
    for (const p of all) { if (p > maxL) result.impossible.push(p); else pieces.push(p); }
    if (pieces.length === 0) { result.ok = false; result.status = 'impossible'; finalize1D(result, kerf, opts); result.validation = validate1D(result, input); return result; }

    let totalSize = 0;
    for (const p of pieces) totalSize += p + kerf;
    const lb = Math.max(1, Math.ceil(totalSize / (maxL + kerf)));     // capacity L+kerf, item size p+kerf
    result.lowerBound = lb;

    // 1) fast heuristics (first-fit / best-fit decreasing)
    let bestH = null;
    for (const mode of ['first', 'best']) {
      const c = heuristic1D(pieces, stocks, kerf, mode);
      if (!bestH) { bestH = c; continue; }
      if (bestH.unplaced.length && !c.unplaced.length) bestH = c;
      else if (!bestH.unplaced.length && !c.unplaced.length && keyBetter(planKey(c.bars, kerf), planKey(bestH.bars, kerf))) bestH = c;
      else if (bestH.unplaced.length && c.unplaced.length && c.unplaced.length < bestH.unplaced.length) bestH = c;
    }
    let bars = bestH.bars;
    let exhausted = false;
    if (bestH.unplaced.length) {
      // stock quantities cannot cover the demand: report the heuristic partial plan honestly
      result.ok = false; result.status = 'insufficient-stock'; result.unplaced = bestH.unplaced;
    } else {
      // 2) bin-completion branch & bound on piece types (deterministic node budget)
      const typeMap = new Map();
      for (const p of pieces) typeMap.set(p, (typeMap.get(p) || 0) + 1);
      const types = Array.from(typeMap.entries()).map(([len, cnt]) => ({ len, cnt })).sort((a, b) => b.len - a.len);
      const s = search1D(types, stocks, kerf, bars, lb, opts.nodeBudget || 60000, opts.timeCapMs || 600);
      if (s.best && keyBetter(s.best.key, planKey(bars, kerf))) bars = s.best.bars;
      exhausted = s.exhausted;
      // 3) local improvement (empty a bar / concentrate offcuts)
      bars = improve1D(clonePlan(bars).map((b, i) => Object.assign(b, { si: bars[i].si })), kerf, opts.improveBudget || 20000);
      result.proven = bars.length === lb || exhausted;
    }
    result.bars = bars;
    finalize1D(result, kerf, opts);
    result.validation = validate1D(result, input);
    if (!result.validation.ok) { result.ok = false; result.status = 'invalid'; }
    else if (result.impossible.length) { result.ok = false; result.status = 'impossible'; }   // some cuts are longer than every stock bar
    else if (result.ok) result.status = result.proven ? 'optimal' : 'best-found';
    return result;
  }

  function finalize1D(result, kerf, opts) {
    const minOff = toUnits(opts.minOffcut != null ? opts.minOffcut : 0);
    result.bars.sort((a, b) => (b.L - a.L) || (barLayout(b.pieces, b.L, kerf).sum - barLayout(a.pieces, a.L, kerf).sum) || (b.pieces.length - a.pieces.length));
    let stockTotal = 0, pieceTotal = 0, kerfTotal = 0, offcutTotal = 0, reusable = 0, reusableCount = 0, unusable = 0;
    result.bars.forEach(b => {
      b.pieces.sort((x, y) => y - x);
      const lay = barLayout(b.pieces, b.L, kerf);
      b.sum = lay.sum; b.kerfLoss = lay.kerfLoss; b.offcut = lay.offcut;
      b.reusable = minOff > 0 && lay.offcut >= minOff;
      b.usedLength = b.L - lay.offcut;                 // pieces + kerf: basis of the existing costing rule
      stockTotal += b.L; pieceTotal += lay.sum; kerfTotal += lay.kerfLoss; offcutTotal += lay.offcut;
      if (b.reusable) { reusable += lay.offcut; reusableCount++; } else unusable += lay.offcut;
    });
    result.totals = {
      barCount: result.bars.length, stock: stockTotal, pieces: pieceTotal, kerf: kerfTotal,
      offcut: offcutTotal, reusable, reusableCount, unusableOffcut: unusable,
      leftover: stockTotal - pieceTotal,               // kerf loss + offcuts
      utilization: stockTotal ? pieceTotal / stockTotal : 0,
      wastePct: stockTotal ? (stockTotal - pieceTotal) / stockTotal : 0
    };
  }

  // Independent validator: recomputes everything from the raw plan and the raw integer input.
  function validate1D(result, input) {
    const errs = [];
    const kerf = result.kerfUnits;
    const got = [];
    const used = new Map();
    for (const b of result.bars) {
      let s = 0;
      for (const p of b.pieces) { s += p; got.push(p); if (!(p > 0)) errs.push('non-positive piece'); }
      const need = s + Math.max(0, b.pieces.length - 1) * kerf;
      if (need > b.L) errs.push('bar overflow: needs ' + need + ' > ' + b.L);
      used.set(b.L, (used.get(b.L) || 0) + 1);
    }
    for (const [len, n] of used) {
      const st = input.stocks.find(x => x.length === len);
      if (!st) errs.push('unknown stock length ' + len);
      else if (st.qty !== Infinity && n > st.qty) errs.push('stock quantity exceeded for ' + len);
    }
    const want = input.cuts.slice().sort((a, b) => a - b);
    const all = got.concat(result.unplaced, result.impossible).sort((a, b) => a - b);
    if (all.length !== want.length) errs.push('piece count mismatch ' + all.length + ' vs ' + want.length);
    else for (let i = 0; i < all.length; i++) if (all[i] !== want[i]) { errs.push('piece mismatch'); break; }
    return { ok: errs.length === 0, errors: errs };
  }

  // Full bars are billed as 1 each. The least-used bar is billed by its actual used length.
  // usedLength is stored in internal units (1/256 inch), so convert it to inches first.
  function aluminiumCostingQty(plan) {
    const bars = plan && plan.bars;
    if (!bars || bars.length === 0) return 0;
    let last = bars[0];
    for (const b of bars) {
      if ((Number(b.usedLength) || 0) < (Number(last.usedLength) || 0)) last = b;
    }
    const usedInches = Math.max(0, fromUnits(Number(last.usedLength) || 0));
    const tiers = [[12, 0.05], [24, 0.1], [36, 0.1666], [48, 0.2], [60, 0.25], [78, 0.333], [120, 0.5], [156, 0.666]];
    const partial = tiers.find(([limit]) => usedInches <= limit)?.[1] ?? 1;
    return Math.round(((bars.length - 1) + partial) * 10000) / 10000;
  }

  // ---------------------------------------------------------------------
  //  2D glass engine (guillotine packing: every layout can be produced with
  //  straight edge-to-edge glass scores).
  //  Gap/kerf model: the usable area is expanded by the gap g (width UW+g,
  //  height UH+g) and every piece by g (w+g, h+g). Non-overlap of expanded
  //  rectangles then guarantees >= g between neighbouring pieces and >= 0
  //  at the usable-area boundary.
  // ---------------------------------------------------------------------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const FIT_RULES = {
    BAF:  (fw, fh, pw, ph) => fw * fh - pw * ph,
    BSSF: (fw, fh, pw, ph) => Math.min(fw - pw, fh - ph),
    BLSF: (fw, fh, pw, ph) => Math.max(fw - pw, fh - ph),
    WAF:  (fw, fh, pw, ph) => -(fw * fh - pw * ph),
    WSSF: (fw, fh, pw, ph) => -Math.min(fw - pw, fh - ph),
    WLSF: (fw, fh, pw, ph) => -Math.max(fw - pw, fh - ph)
  };
  // true => split horizontally (right = (fw-pw) x ph, bottom = fw x (fh-ph)); false => vertically
  const SPLIT_RULES = {
    SAS:   (fw, fh, pw, ph) => (fw - pw) < (fh - ph),
    LAS:   (fw, fh, pw, ph) => (fw - pw) >= (fh - ph),
    SLAS:  (fw, fh) => fw <= fh,
    LLAS:  (fw, fh) => fw > fh,
    MAXAS: (fw, fh, pw, ph) => Math.max((fw - pw) * ph, fw * (fh - ph)) >= Math.max((fw - pw) * fh, pw * (fh - ph)),
    MINAS: (fw, fh, pw, ph) => Math.max((fw - pw) * ph, fw * (fh - ph)) <= Math.max((fw - pw) * fh, pw * (fh - ph))
  };
  const ORDERS = {
    area:  t => t.ew * t.eh,
    long:  t => Math.max(t.ew, t.eh) * 1e6 + Math.min(t.ew, t.eh),
    short: t => Math.min(t.ew, t.eh) * 1e6 + Math.max(t.ew, t.eh),
    perim: t => t.ew + t.eh,
    width: t => t.ew * 1e6 + t.eh,
    height: t => t.eh * 1e6 + t.ew
  };

  // Decode an ordering of piece instances into sheets. All dimensions are in "decode space"
  // (possibly transposed). types[i] = {ew, eh, canRotate}.
  function decode2D(order, instType, types, EW, EH, cfg, maxSheets) {
    const fit = FIT_RULES[cfg.fit], split = SPLIT_RULES[cfg.split];
    const sheets = [];
    const unplaced = [];
    const orients = types.map(t => {
      const o = [{ pw: t.ew, ph: t.eh, flip: false }];
      if (t.canRotate && t.ew !== t.eh) o.push({ pw: t.eh, ph: t.ew, flip: true });
      return o.filter(q => q.pw <= EW && q.ph <= EH);
    });

    function newSheet() { return { placed: [], free: [{ x: 0, y: 0, w: EW, h: EH }], usedArea: 0 }; }

    function bestSpot(sh, ti) {
      let best = null, bs = Infinity;
      const os = orients[ti];
      for (let f = 0; f < sh.free.length; f++) {
        const r = sh.free[f];
        for (let k = 0; k < os.length; k++) {
          const o = os[k];
          if (o.pw <= r.w && o.ph <= r.h) {
            const s = fit(r.w, r.h, o.pw, o.ph);
            if (s < bs) { bs = s; best = { f, o }; }
          }
        }
      }
      return best ? { f: best.f, o: best.o, score: bs } : null;
    }

    function put(sh, inst, spot) {
      const r = sh.free[spot.f];
      const { pw, ph, flip } = spot.o;
      sh.free.splice(spot.f, 1);
      sh.placed.push({ inst, x: r.x, y: r.y, w: pw, h: ph, flip });
      sh.usedArea += pw * ph;
      const lw = r.w - pw, lh = r.h - ph;
      const horiz = split(r.w, r.h, pw, ph);
      let a, b;
      if (horiz) { a = { x: r.x + pw, y: r.y, w: lw, h: ph }; b = { x: r.x, y: r.y + ph, w: r.w, h: lh }; }
      else       { a = { x: r.x + pw, y: r.y, w: lw, h: r.h }; b = { x: r.x, y: r.y + ph, w: pw, h: lh }; }
      if (a.w > 0 && a.h > 0) sh.free.push(a);
      if (b.w > 0 && b.h > 0) sh.free.push(b);
    }

    if (cfg.mode === 'global') {
      for (const inst of order) {
        const ti = instType[inst];
        if (!orients[ti].length) { unplaced.push(inst); continue; }
        let bi = -1, bspot = null;
        for (let s = 0; s < sheets.length; s++) {
          const sp = bestSpot(sheets[s], ti);
          if (sp && (!bspot || sp.score < bspot.score)) { bspot = sp; bi = s; }
        }
        if (!bspot) {
          if (sheets.length >= maxSheets) { unplaced.push(inst); continue; }
          sheets.push(newSheet()); bi = sheets.length - 1;
          bspot = bestSpot(sheets[bi], ti);
        }
        put(sheets[bi], inst, bspot);
      }
    } else {                                              // sequential: fill one sheet at a time
      let pending = order.filter(inst => { if (!orients[instType[inst]].length) { unplaced.push(inst); return false; } return true; });
      while (pending.length) {
        if (sheets.length >= maxSheets) { unplaced.push(...pending); break; }
        const sh = newSheet(); sheets.push(sh);
        const rest = [];
        for (const inst of pending) {
          const sp = bestSpot(sh, instType[inst]);
          if (sp) put(sh, inst, sp); else rest.push(inst);
        }
        pending = rest;
      }
    }
    return { sheets, unplaced };
  }

  function cost2D(res, usedBase) {
    // lower is better: sheets (+ penalty for unplaced), then concentration of used area (sum of squares)
    let sq = 0;
    for (const s of res.sheets) sq += s.usedArea * s.usedArea / usedBase;
    return { sheets: res.sheets.length + res.unplaced.length * 1e4, neg: -sq };
  }
  function costBetter(a, b) { return a.sheets !== b.sheets ? a.sheets < b.sheets : a.neg < b.neg; }

  // Merge free rectangles that share a full edge, so a leftover region is reported as one rectangle.
  function mergeFree(rects) {
    let list = rects.map(r => Object.assign({}, r));
    let merged = true;
    while (merged) {
      merged = false;
      outer:
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const a = list[i], b = list[j];
          if (a.y === b.y && a.h === b.h && (a.x + a.w === b.x || b.x + b.w === a.x)) {
            a.x = Math.min(a.x, b.x); a.w += b.w; list.splice(j, 1); merged = true; break outer;
          }
          if (a.x === b.x && a.w === b.w && (a.y + a.h === b.y || b.y + b.h === a.y)) {
            a.y = Math.min(a.y, b.y); a.h += b.h; list.splice(j, 1); merged = true; break outer;
          }
        }
      }
    }
    return list;
  }

  // Public: plan glass cutting.
  //  piecesIn : [{w, h, qty?, canRotate?, label?}] (inches)       sheet : {w, h, maxSheets?} (inches)
  //  opts     : {gap, margin, minOffcutW, minOffcutH, allowRotate (global default true), iterations, timeCapMs, seed}
  function planGlass(piecesIn, sheetIn, opts) {
    opts = opts || {};
    const gap = Math.max(0, toUnits(opts.gap || 0));
    const margin = Math.max(0, toUnits(opts.margin || 0));
    const W = toUnits(sheetIn.w), H = toUnits(sheetIn.h);
    const maxSheets = (sheetIn.maxSheets == null || sheetIn.maxSheets === Infinity) ? Infinity : Math.max(0, Math.floor(sheetIn.maxSheets));
    const minOffW = toUnits(opts.minOffcutW || 0), minOffH = toUnits(opts.minOffcutH || 0);
    const allowRotate = opts.allowRotate !== false;
    const UW = W - 2 * margin, UH = H - 2 * margin;

    // piece types (grouped by size + rotation permission); labels G1, G2... by decreasing area
    const typeMap = new Map();
    (piecesIn || []).forEach(p => {
      const w = toUnits(p.w), h = toUnits(p.h);
      const q = p.qty == null ? 1 : Math.floor(p.qty);
      if (!(w > 0) || !(h > 0) || !(q > 0)) return;
      const rot = allowRotate && p.canRotate !== false;
      const key = w + 'x' + h + (rot ? 'r' : 'n');
      if (!typeMap.has(key)) typeMap.set(key, { w, h, qty: 0, canRotate: rot });
      typeMap.get(key).qty += q;
    });
    const typesReal = Array.from(typeMap.values()).sort((a, b) => (b.w * b.h) - (a.w * a.h) || b.w - a.w || b.h - a.h);
    typesReal.forEach((t, i) => { t.label = 'G' + (i + 1); });

    const result = {
      ok: true, status: 'empty', sheets: [], types: typesReal, impossible: [], unplaced: [],
      lowerBound: 0, proven: false, params: { W, H, gap, margin, minOffW, minOffH, maxSheets }, input: null
    };
    const demand = typesReal.map(t => t.qty);
    result.input = { demand, types: typesReal.map(t => ({ w: t.w, h: t.h, canRotate: t.canRotate })) };
    if (typesReal.length === 0) return result;
    if (!(UW > 0) || !(UH > 0)) { result.ok = false; result.status = 'no-sheet'; result.impossible = typesReal.map((t, i) => ({ type: i, qty: t.qty })); return result; }

    const EW = UW + gap, EH = UH + gap;
    const fitsType = t => (t.w <= UW && t.h <= UH) || (t.canRotate && t.h <= UW && t.w <= UH);
    const instType = [];
    typesReal.forEach((t, i) => {
      if (!fitsType(t)) result.impossible.push({ type: i, qty: t.qty });
      else for (let k = 0; k < t.qty; k++) instType.push(i);
    });
    const n = instType.length;
    if (n === 0) { result.ok = false; result.status = 'impossible'; result.validation = validate2D(result); return result; }

    // lower bound by expanded area
    let areaSum = 0;
    for (const ti of instType) areaSum += (typesReal[ti].w + gap) * (typesReal[ti].h + gap);
    result.lowerBound = Math.max(1, Math.ceil(areaSum / (EW * EH)));

    function makeSpace(transposed) {
      return {
        transposed,
        EW: transposed ? EH : EW, EH: transposed ? EW : EH,
        types: typesReal.map(t => ({ ew: (transposed ? t.h : t.w) + gap, eh: (transposed ? t.w : t.h) + gap, canRotate: t.canRotate }))
      };
    }
    const spaces = [makeSpace(false), makeSpace(true)];
    const usedBase = EW * EH;

    function orderBy(space, name) {
      const key = ORDERS[name];
      const idx = instType.map((_, i) => i);
      idx.sort((a, b) => key(space.types[instType[b]]) - key(space.types[instType[a]]) || a - b);
      return idx;
    }

    const t0 = Date.now();
    const timeCap = opts.timeCapMs || 2500;
    let best = null;
    const lb = result.lowerBound;
    const small = n <= 60;
    const fits = small ? Object.keys(FIT_RULES) : ['BAF', 'BSSF', 'BLSF'];
    const splits = small ? Object.keys(SPLIT_RULES) : ['SAS', 'LAS', 'MINAS', 'MAXAS'];
    const orders = small ? Object.keys(ORDERS) : ['area', 'long', 'short', 'perim'];

    function consider(res, space, order, cfg) {
      const c = cost2D(res, usedBase);
      if (!best || costBetter(c, best.cost)) best = { res, space, order, cfg, cost: c };
    }

    // Phase 1: compare heuristic combinations (placement rule x split rule x ordering x sheet orientation x mode)
    phase1:
    for (const space of spaces) {
      for (const on of orders) {
        const order = orderBy(space, on);
        for (const mode of ['sequential', 'global']) {
          for (const f of fits) for (const s of splits) {
            const cfg = { mode, fit: f, split: s };
            consider(decode2D(order, instType, space.types, space.EW, space.EH, cfg, maxSheets), space, order, cfg);
            if (best.cost.sheets === lb && best.cost.sheets < 1e4 && Date.now() - t0 > timeCap * 0.5) break phase1;
            if (Date.now() - t0 > timeCap) break phase1;
          }
        }
      }
    }

    // Phase 2: seeded local search on the piece order (swap / move), starting from the best heuristic.
    const iterations = opts.iterations != null ? opts.iterations : Math.max(50, Math.min(1500, Math.floor(400000 / n)));
    const rand = mulberry32((opts.seed != null ? opts.seed : 20240611) ^ (n * 2654435761));
    let curOrder = best.order.slice(), curCost = best.cost, bestSpace = best.space, bestCfg = best.cfg;
    for (let it = 0; it < iterations && n > 1; it++) {
      if (best.cost.sheets === lb && best.cost.sheets < 1e4 && it > iterations / 4) break;       // at the lower bound: only a short search for tidier offcuts
      if ((it & 15) === 0 && Date.now() - t0 > timeCap) break;
      const cand = curOrder.slice();
      const a = Math.floor(rand() * n), b = Math.floor(rand() * n);
      if (rand() < 0.5) { const tmp = cand[a]; cand[a] = cand[b]; cand[b] = tmp; }
      else { const v = cand.splice(a, 1)[0]; cand.splice(b, 0, v); }
      const res = decode2D(cand, instType, bestSpace.types, bestSpace.EW, bestSpace.EH, bestCfg, maxSheets);
      const c = cost2D(res, usedBase);
      if (!costBetter(curCost, c) ) {                      // accept equal or better
        curOrder = cand; curCost = c;
        if (costBetter(c, best.cost)) best = { res, space: bestSpace, order: cand, cfg: bestCfg, cost: c };
      }
    }

    // Build the real-coordinate plan from the winning decode
    const space = best.space;
    const real = best.res.sheets.map((sh, si) => {
      const placements = sh.placed.map(p => {
        let x = p.x, y = p.y, w = p.w - gap, h = p.h - gap;
        if (space.transposed) { [x, y] = [y, x]; [w, h] = [h, w]; }
        const ti = instType[p.inst];
        const t = typesReal[ti];
        const rotated = !(w === t.w && h === t.h);
        return { type: ti, label: t.label, x: margin + x, y: margin + y, w, h, rotated };
      });
      let free = mergeFree(sh.free);
      free = free.map(r => {
        let q = r;
        if (space.transposed) q = { x: r.y, y: r.x, w: r.h, h: r.w };
        return { x: margin + q.x, y: margin + q.y, w: q.w - gap, h: q.h - gap };
      }).filter(r => r.w > 0 && r.h > 0);
      return { index: si + 1, placements, offcuts: free };
    });
    real.sort((a, b) => b.placements.length - a.placements.length || a.index - b.index);
    real.forEach((s, i) => { s.index = i + 1; });
    result.sheets = real;
    result.unplaced = best.res.unplaced.map(inst => instType[inst]);
    if (result.unplaced.length) { result.ok = false; result.status = 'insufficient-stock'; }

    // statistics per sheet and in total
    const sheetArea = W * H;
    const fitsMin = r => (minOffW > 0 && minOffH > 0) && ((r.w >= minOffW && r.h >= minOffH) || (allowRotate && r.w >= minOffH && r.h >= minOffW));
    let tUsed = 0, tReus = 0, tSheet = 0, tReusCount = 0;
    result.sheets.forEach(s => {
      let used = 0; s.placements.forEach(p => { used += p.w * p.h; });
      s.offcuts.forEach(o => { o.reusable = fitsMin(o); });
      let reus = 0, freeArea = 0;
      s.offcuts.forEach(o => { freeArea += o.w * o.h; if (o.reusable) { reus += o.w * o.h; tReusCount++; } });
      const leftover = sheetArea - used;
      const marginArea = sheetArea - UW * UH;
      s.stats = {
        sheetArea, usedArea: used, leftover, reusableArea: reus, unusableArea: leftover - reus,
        marginArea, gapArea: Math.max(0, UW * UH - used - freeArea),
        utilization: used / sheetArea, leftoverPct: leftover / sheetArea, wastePct: (leftover - reus) / sheetArea
      };
      tUsed += used; tReus += reus; tSheet += sheetArea;
    });
    result.totals = {
      sheetCount: result.sheets.length, sheetArea: tSheet, usedArea: tUsed, leftover: tSheet - tUsed,
      reusableArea: tReus, reusableCount: tReusCount, unusableArea: tSheet - tUsed - tReus,
      utilization: tSheet ? tUsed / tSheet : 0, leftoverPct: tSheet ? (tSheet - tUsed) / tSheet : 0,
      wastePct: tSheet ? (tSheet - tUsed - tReus) / tSheet : 0
    };
    result.proven = result.sheets.length === lb && !result.unplaced.length;
    result.validation = validate2D(result);
    if (!result.validation.ok) { result.ok = false; result.status = 'invalid'; }
    else if (result.impossible.length) { result.ok = false; result.status = 'impossible'; }
    else if (result.ok) result.status = result.proven ? 'optimal' : 'best-found';
    return result;
  }

  // Independent validator: uses only the produced placements and the raw input demand.
  function validate2D(result) {
    const errs = [];
    const P = result.params, types = result.input.types, demand = result.input.demand.slice();
    const UWmin = P.margin, UXmax = P.W - P.margin, UYmax = P.H - P.margin;
    const counts = types.map(() => 0);
    if (result.sheets.length > P.maxSheets) errs.push('sheet limit exceeded');
    result.sheets.forEach(s => {
      const pl = s.placements;
      pl.forEach(p => {
        const t = types[p.type];
        if (!t) { errs.push('unknown piece type'); return; }
        counts[p.type]++;
        const same = p.w === t.w && p.h === t.h, swapped = p.w === t.h && p.h === t.w;
        if (!(same || swapped)) errs.push('dimension mismatch on ' + p.label);
        if (swapped && !same && !t.canRotate) errs.push('prohibited rotation on ' + p.label);
        if (p.rotated !== (!same)) errs.push('rotation flag wrong on ' + p.label);
        if (p.x < UWmin || p.y < UWmin || p.x + p.w > UXmax || p.y + p.h > UYmax) errs.push('piece outside usable area on sheet ' + s.index);
      });
      for (let i = 0; i < pl.length; i++) for (let j = i + 1; j < pl.length; j++) {
        const a = pl[i], b = pl[j];
        const sep = a.x + a.w + P.gap <= b.x || b.x + b.w + P.gap <= a.x || a.y + a.h + P.gap <= b.y || b.y + b.h + P.gap <= a.y;
        if (!sep) errs.push('overlap/gap violation on sheet ' + s.index);
      }
      // offcuts must lie inside the sheet and must not overlap any piece
      s.offcuts.forEach(o => {
        if (o.x < 0 || o.y < 0 || o.x + o.w > P.W || o.y + o.h > P.H) errs.push('offcut outside sheet');
        pl.forEach(p => {
          if (o.x < p.x + p.w && p.x < o.x + o.w && o.y < p.y + p.h && p.y < o.y + o.h) errs.push('offcut overlaps a piece on sheet ' + s.index);
        });
      });
      if (s.stats) {
        let used = 0; pl.forEach(p => { used += p.w * p.h; });
        if (used !== s.stats.usedArea) errs.push('used-area mismatch on sheet ' + s.index);
        if (s.stats.usedArea + s.stats.leftover !== s.stats.sheetArea) errs.push('area balance mismatch on sheet ' + s.index);
      }
    });
    const missing = result.unplaced.length ? result.unplaced.slice() : [];
    const unplacedCount = types.map(() => 0);
    missing.forEach(ti => { unplacedCount[ti]++; });
    const imp = types.map(() => 0);
    result.impossible.forEach(x => { imp[x.type] += x.qty; });
    types.forEach((t, i) => {
      if (counts[i] + unplacedCount[i] + imp[i] !== demand[i]) errs.push('quantity mismatch for G' + (i + 1) + ': ' + (counts[i] + unplacedCount[i] + imp[i]) + ' vs ' + demand[i]);
    });
    return { ok: errs.length === 0, errors: errs };
  }

  // Glass billing uses area-equivalent sheets rounded UP to quarter-sheet increments.
  function glassBillingQty(glassPieces, sheetW, sheetH) {
    if (!Array.isArray(glassPieces) || glassPieces.length === 0 || !(sheetW > 0) || !(sheetH > 0)) return 0;
    const totalArea = glassPieces.reduce((sum, p) => sum + (p.w * p.h), 0);
    return Math.ceil((totalArea / (sheetW * sheetH)) * 4 - 1e-9) / 4;
  }

  // Liner (inches) = 1 x ကျည်းခွေ + 2 x အလယ်တိုင် + 1 x တံခါးဆံ
  //   ကျည်းခွေ  = Outer Frame profile  (total length of all outer-frame cuts)
  //   အလယ်တိုင် = Mullion profile      (total length of all mullion cuts; a connected line counts once at its full length)
  //   တံခါးဆံ   = Sash Profile         (total length of all sash cuts)
  // No other multiplier and no deduction is applied.
  function computeLiner(outerFrameLen, mullionLen, sashLen) {
    return (1 * outerFrameLen) + (2 * mullionLen) + (1 * sashLen);
  }

  // Cut list for ONE frame of an item (pure function: no DOM access).
  //  - Sash profile and glass use the FULL cell size from the drawing: no extra
  //    deductions, margins or overlaps are applied anywhere in this function.
  //  - A merged cell is one cell (one glass, one sash/click set, its full merged size);
  //    segments inside it are inactive and are not counted as mullions.
  //  - A connected line is ONE mullion cut at its total length.
  function computeItemLayout(data, w, h) {
    const colDims = fitDims(data.colDims, data.vLines + 1, w);
    const rowDims = fitDims(data.rowDims, data.hLines + 1, h);
    const sumRange = (arr, a, b) => arr.slice(a, b + 1).reduce((x, y) => x + y, 0);
    const out = { outer: [w, w, h, h], mullions: [], clicks: [], sashes: [], glass: [], colDims, rowDims };

    getLogicalSegments(data).forEach(u => out.mullions.push(segmentLength(u, colDims, rowDims)));

    getRegions(data).forEach(rg => {
      const cw = sumRange(colDims, rg.minC, rg.maxC);
      const ch = sumRange(rowDims, rg.minR, rg.maxR);
      if (rg.type === 'fixed') {
        out.clicks.push(cw, cw, ch, ch);
      } else {
        out.sashes.push({ w: cw, h: ch, type: rg.type });
      }
      out.glass.push({ w: cw, h: ch });
    });
    return out;
  }

  // Re-entrancy guard: a double tap can never start two calculations or mix stale state.
  let calcRunning = false;
  function calculateCutList() {
    if (calcRunning) return;
    calcRunning = true;
    const btn = document.querySelector('.btn-run[onclick="calculateCutList()"]');
    const label = btn ? btn.textContent : '';
    if (btn) { btn.textContent = 'Calculating…'; btn.disabled = true; }
    setTimeout(() => {
      try { runCalculation(); }
      catch (err) { console.error(err); showMessage('Calculation error: ' + err.message); }
      finally { calcRunning = false; if (btn) { btn.textContent = label; btn.disabled = false; } }
    }, 30);
  }

  function runCalculation() {
    const items = document.querySelectorAll('#item-list .card');
    const kerf = getKerfInches();

    const glassWInput = document.getElementById('global-glass-w');
    let glassW = parseFloat(glassWInput.dataset.inches) || parseToInches(glassWInput.value, currentUnit);

    const glassHInput = document.getElementById('global-glass-h');
    let glassH = parseFloat(glassHInput.dataset.inches) || parseToInches(glassHInput.value, currentUnit);

    calculatedProfileData = {
      'Outer Frame': [], 'Mullion': [], 'Click': [], 'Sash Profile': [], 'Glass': []
    };
    calculatedAccessoriesData = {
      'Outer Cleat': 0, 'Sash Cleat': 0, 'Corner Plate': 0, 'Liner': 0,
      'Casement Hinge': 0, 'Friction Stay': 0, 'Two Point Lock': 0, 'Handle': 0, 'Wind Stay': 0
    };

    let totalGrandCost = 0;
    let totalSqft = 0;
    const sum = arr => arr.reduce((a, b) => a + b, 0);

    items.forEach(item => {
      let h = parseFloat(item.querySelector('.door-h').dataset.inches) || parseToInches(item.querySelector('.door-h').value, currentUnit) || 0;
      let w = parseFloat(item.querySelector('.door-w').dataset.inches) || parseToInches(item.querySelector('.door-w').value, currentUnit) || 0;
      const qtyRaw = item.querySelector('.door-qty').value.trim();
      const qty = qtyRaw === '' ? 0 : parseInt(qtyRaw, 10);

      // Empty / invalid dimensions or quantity never produces phantom calculations.
      if (!(h > 0) || !(w > 0) || !Number.isFinite(qty) || qty <= 0) return;

      totalSqft += ((w * h) / 144) * qty;

      // Work on a normalized COPY so a calculation never mutates the drawing.
      const dd = normalizeDrawing(cloneDrawingData(cardDrawings[item.id] || newDrawingData()));
      const L = computeItemLayout(dd, w, h);

      for (let i = 0; i < qty; i++) {
        calculatedProfileData['Outer Frame'].push(...L.outer);
        calculatedProfileData['Mullion'].push(...L.mullions);
        calculatedProfileData['Click'].push(...L.clicks);
        L.glass.forEach(g => calculatedProfileData['Glass'].push({ w: g.w, h: g.h }));
        L.sashes.forEach(s => {
          calculatedProfileData['Sash Profile'].push(s.w, s.w, s.h, s.h);
          if (s.type === 'casement') {
            calculatedAccessoriesData['Casement Hinge'] += s.h > 72 ? 4 : (s.h > 48 || s.w > 24 ? 3 : 2);
            calculatedAccessoriesData['Two Point Lock'] += 1;
            calculatedAccessoriesData['Wind Stay'] += 1;
          } else if (s.type === 'awning') {
            calculatedAccessoriesData['Friction Stay'] += 2;
            calculatedAccessoriesData['Handle'] += 1;
          }
        });
      }

      // Cleats / corner plates: THIS item's frames and sashes only (previously the running
      // totals of all earlier items were added again for every extra item).
      calculatedAccessoriesData['Outer Cleat'] += qty * 4;
      calculatedAccessoriesData['Sash Cleat'] += qty * L.sashes.length * 4;
      calculatedAccessoriesData['Corner Plate'] += qty * 4 + qty * L.sashes.length * 4;
    });

    // Liner = 1 x ကျည်းခွေ (outer frame) + 2 x အလယ်တိုင် (mullions) + 1 x တံခါးဆံ (sash profile)
    calculatedAccessoriesData['Liner'] = computeLiner(
      sum(calculatedProfileData['Outer Frame']),
      sum(calculatedProfileData['Mullion']),
      sum(calculatedProfileData['Sash Profile'])
    );

    const tbody = document.getElementById('report-body');
    tbody.innerHTML = '';
    calculatedPlans = { alu: {}, glass: null, meta: { kerf, glassW, glassH } };   // fresh every run: no stale plans
    const minAluOffcut = 0; // Reusable-offcut threshold setting removed; cutting lengths are unchanged.

    tbody.innerHTML += `<tr class="section-divider"><td colspan="3">Aluminium Profiles</td></tr>`;
    for (let profile in calculatedProfileData) {
      if (profile === 'Glass') continue;
      let cuts = calculatedProfileData[profile];
      if (cuts.length > 0) {
        let barLen = getProfileLength(profile);
        let plan = planAluminium(cuts, [{ length: barLen }], kerf, { minOffcut: minAluOffcut });
        // Costing keeps the existing business rule; the physical plan above is independent of it.
        let costingQty = plan.status === 'invalid' ? 0 : aluminiumCostingQty(plan);
        calculatedPlans.alu[profile] = { plan, barLen, cuts: cuts.slice(), costingQty };
        let cost = Math.ceil((costingQty * getPrice(profile)) / 100) * 100;
        totalGrandCost += cost;
        tbody.innerHTML += `
          <tr class="clickable-row" onclick="openItemDetail('${profile}')">
            <td>${profile} ➔</td>
            <td class="text-right highlight-qty" data-copy="${costingQty} bars">${costingQty} bars<span class="sub-note">${plan.bars.length} physical bar${plan.bars.length === 1 ? '' : 's'} cut</span></td>
            <td class="text-right">${cost > 0 ? cost.toLocaleString() : '-'}</td>
          </tr>`;
        aluProblems(plan, barLen).forEach(m => { tbody.innerHTML += `<tr class="warn-row"><td colspan="3">⚠ ${profile}: ${m}</td></tr>`; });
      }
    }

    let glassReportHtml = `<tr class="section-divider"><td colspan="3">Glass</td></tr>`;
    let glassPieces = calculatedProfileData['Glass'];
    let glassPlan = null;
    if (glassPieces.length > 0 && glassW > 0 && glassH > 0) {
      glassPlan = planGlass(glassPieces.map(p => ({ w: p.w, h: p.h, qty: 1 })), { w: glassW, h: glassH }, {
        gap: 0, margin: 0, minOffcutW: 0, minOffcutH: 0,
        allowRotate: (document.getElementById('global-glass-rotate') || {}).value !== 'no'
      });
    }
    // Preserved costing rule (area / sheet area, rounded up). It never decides the physical sheet count.
    let glassBilling = glassBillingQty(glassPieces, glassW, glassH);
    calculatedPlans.glass = { plan: glassPlan, billing: glassBilling };
    let glassCost = Math.ceil((glassBilling * getPrice('glass')) / 100) * 100;
    totalGrandCost += glassCost;
    glassReportHtml += `
      <tr class="clickable-row" onclick="openItemDetail('Glass')">
        <td>Glass Sheets ➔</td>
        <td class="text-right highlight-qty" data-copy="${glassBilling} sheet(s)">${glassBilling} sheet(s)${glassPlan && glassPlan.sheets.length ? `<span class="sub-note">${glassPlan.sheets.length} physical sheet${glassPlan.sheets.length === 1 ? '' : 's'} cut</span>` : ''}</td>
        <td class="text-right">${glassCost > 0 ? glassCost.toLocaleString() : '-'}</td>
      </tr>`;
    if (glassPieces.length > 0 && !glassPlan) glassReportHtml += `<tr class="warn-row"><td colspan="3">⚠ Glass: set a valid Glass Sheet Width and Height in Settings to get a cutting plan.</td></tr>`;
    if (glassPlan) glassProblems(glassPlan).forEach(m => { glassReportHtml += `<tr class="warn-row"><td colspan="3">⚠ Glass: ${m}</td></tr>`; });

    tbody.innerHTML += `<tr class="section-divider"><td colspan="3">Accessories</td></tr>`;
    for (let acc in calculatedAccessoriesData) {
      let qty = calculatedAccessoriesData[acc];
      if (qty > 0) {
        let unitLabel = 'pcs', billQty = qty, cost = 0;
        if (acc === 'Liner') {
          const rollFeet = parseFloat(document.getElementById('liner-roll-feet')?.value) || 0;
          const rollInches = rollFeet * 12;
          billQty = rollInches > 0 ? Math.ceil((qty / rollInches) * 4 - 1e-9) / 4 : 0;
          unitLabel = 'roll(s)';
          cost = Math.ceil((billQty * getPrice(acc)) / 100) * 100;
        } else {
          cost = Math.ceil((qty * getPrice(acc)) / 100) * 100;
        }
        totalGrandCost += cost;
        const shownQty = acc === 'Liner' ? String(billQty) : qty.toFixed(1);
        tbody.innerHTML += `<tr><td>${acc}</td><td class="text-right highlight-qty">${shownQty} ${unitLabel}</td><td class="text-right">${cost > 0 ? cost.toLocaleString() : '-'}</td></tr>`;
      }
    }

    let miscPricePerSqft = parseFloat(document.getElementById('global-misc-price').value) || 0;
    let miscCost = Math.ceil((totalSqft * miscPricePerSqft) / 100) * 100;
    totalGrandCost += miscCost;

    tbody.innerHTML += `<tr class="section-divider"><td colspan="3">Labor & Miscellaneous</td></tr>`;
    tbody.innerHTML += glassReportHtml;
    tbody.innerHTML += `
      <tr>
        <td>Total Area (Sqft)</td>
        <td class="text-right highlight-qty">${totalSqft.toFixed(2)} sqft</td>
        <td class="text-right">${miscCost > 0 ? miscCost.toLocaleString() : '-'}</td>
      </tr>`;

    tbody.innerHTML += `
      <tr style="border-top: 2px solid var(--accent);">
        <td colspan="2" class="text-right" style="font-weight: bold; color: var(--accent); padding-top:16px;">Grand Total</td>
        <td class="text-right highlight-qty" style="font-size:15px; padding-top:16px;">${totalGrandCost.toLocaleString()} Ks</td>
      </tr>
      <tr>
        <td colspan="2" class="text-right" style="color: var(--sub); font-size:12px; padding-bottom:16px;">Price Per Sqft</td>
        <td class="text-right" style="color: var(--sub); font-size:13px; padding-bottom:16px;">${totalSqft > 0 ? Math.ceil(totalGrandCost / totalSqft).toLocaleString() : 0} Ks / sqft</td>
      </tr>`;

    document.getElementById('input-screen').classList.add('hidden');
    document.getElementById('output-screen').classList.remove('hidden');
  }

  // ---------------------------------------------------------------------
  //  UI adapters: read settings, format, and render the REAL stored plans.
  // ---------------------------------------------------------------------
  let calculatedPlans = { alu: {}, glass: null, meta: null };

  function readInches(id, fallback) {
    const el = document.getElementById(id);
    if (!el) return fallback || 0;
    let v = parseFloat(el.dataset.inches);
    if (isNaN(v)) v = parseToInches(el.value || 0, currentUnit);
    return (isFinite(v) && v >= 0) ? v : (fallback || 0);
  }
  const fmtU = u => displayLength(fromUnits(u));
  const fmtPct = x => (x * 100).toFixed(1) + '%';
  function fmtArea(units2) {
    const in2 = units2 / (UNITS_PER_INCH * UNITS_PER_INCH);
    return currentUnit === 'mm' ? (in2 * 0.00064516).toFixed(3) + ' m²' : (in2 / 144).toFixed(2) + ' sqft';
  }
  function shortLen(inches) {
    return currentUnit === 'mm' ? String(Math.round(inches * 25.4)) : formatFeetInches(inches);
  }
  function metricRows(rows) {
    return rows.map(r => `<div class="list-item-row"><span>${r[0]}</span><span style="color:var(--accent); font-weight:600; text-align:right;">${r[1]}</span></div>`).join('');
  }
  function groupRuns(arr, fmt) {
    const out = [];
    for (let i = 0; i < arr.length;) {
      let j = i; while (j < arr.length && arr[j] === arr[i]) j++;
      out.push((j - i > 1 ? (j - i) + '× ' : '') + fmt(arr[i]));
      i = j;
    }
    return out.join(' · ');
  }
  function aluStatusText(plan) {
    if (plan.status === 'optimal') return 'Minimum bar count proven';
    if (plan.status === 'best-found') return `Best solution found (lower bound ${plan.lowerBound} bar${plan.lowerBound === 1 ? '' : 's'}; optimality not proven)`;
    if (plan.status === 'impossible') return 'Some cuts cannot be made';
    if (plan.status === 'insufficient-stock') return 'Not enough stock for all cuts';
    if (plan.status === 'invalid') return 'Plan failed validation — do not use';
    return plan.status;
  }
  function glassStatusText(plan) {
    if (plan.status === 'optimal') return 'Minimum sheet count proven (area lower bound reached)';
    if (plan.status === 'best-found') return `Best solution found (area lower bound ${plan.lowerBound} sheet${plan.lowerBound === 1 ? '' : 's'}; optimality not proven)`;
    if (plan.status === 'impossible') return 'Some pieces do not fit the usable sheet area';
    if (plan.status === 'insufficient-stock') return 'Not enough sheets for all pieces';
    if (plan.status === 'invalid') return 'Plan failed validation — do not use';
    return plan.status;
  }

  function aluProblems(plan, barLen) {
    const msgs = [];
    if (plan.status === 'invalid') msgs.push('Cutting plan failed validation: ' + plan.validation.errors.slice(0, 2).join('; '));
    if (plan.impossible.length) msgs.push(`${plan.impossible.length} cut(s) are longer than the ${displayLength(barLen)} stock bar (longest ${fmtU(Math.max(...plan.impossible))}) and cannot be cut.`);
    if (plan.unplaced.length) msgs.push(`${plan.unplaced.length} cut(s) could not be placed with the available stock.`);
    return msgs;
  }
  function glassProblems(plan) {
    const msgs = [];
    if (plan.status === 'invalid') msgs.push('Glass plan failed validation: ' + plan.validation.errors.slice(0, 2).join('; '));
    if (plan.impossible.length) {
      const n = plan.impossible.reduce((a, x) => a + x.qty, 0);
      msgs.push(`${n} glass piece(s) do not fit the usable sheet area (${plan.impossible.map(x => { const t = plan.types[x.type]; return fmtU(t.w) + ' × ' + fmtU(t.h); }).join(', ')}).`);
    }
    if (plan.unplaced.length) msgs.push(`${plan.unplaced.length} glass piece(s) could not be placed with the available sheets.`);
    return msgs;
  }

  function renderAluminiumDetail(profileName) {
    const entry = calculatedPlans.alu[profileName];
    const pageList = document.getElementById('page-list'), pageDiagram = document.getElementById('page-diagram');
    if (!entry) { pageList.innerHTML = pageDiagram.innerHTML = '<div class="diag-meta">No calculation available. Run the calculation first.</div>'; return; }
    const { plan, barLen, cuts, costingQty } = entry;
    const T = plan.totals;
    let html = '';
    aluProblems(plan, barLen).forEach(m => { html += `<div class="diag-warn">⚠ ${m}</div>`; });
    html += `<div class="diag-meta">${aluStatusText(plan)}</div>`;
    html += metricRows([
      ['Required cut material', fmtU(T.pieces) + ` (${plan.bars.reduce((a, b) => a + b.pieces.length, 0)} pcs)`],
      ['Physical stock bars', `${T.barCount} × ${displayLength(barLen)}`],
      ['Stock consumed', fmtU(T.stock)],
      ['Kerf loss', fmtU(T.kerf)],
      ['Offcuts (total)', fmtU(T.offcut)],
      ['  of which reusable', `${fmtU(T.reusable)} (${T.reusableCount} pc)`],
      ['  of which not reusable', fmtU(T.unusableOffcut)],
      ['Utilization', fmtPct(T.utilization)],
      ['Waste (kerf + offcuts)', fmtPct(T.wastePct)],
      ['Billing quantity (costing rule)', costingQty + ' bars']
    ]);
    html += `<div style="margin:12px 0 4px; font-size:12px; color:var(--sub);">Required cuts:</div>`;
    const counts = {};
    cuts.forEach(c => { const f = displayLength(c); counts[f] = (counts[f] || 0) + 1; });
    for (const len in counts) html += `<div class="list-item-row"><span>${len}</span><span style="color:var(--accent); font-weight:600;">${counts[len]} pcs</span></div>`;
    pageList.innerHTML = html;

    let d = `<div class="diag-meta">Cutting layouts — ${plan.bars.length} bar(s). Red ticks = saw kerf. Green dashed = reusable offcut.</div>`;
    plan.bars.forEach((bar, idx) => {
      d += `<div style="font-size:12px; margin-top:10px; color:var(--text); font-weight:600;">Bar #${idx + 1} <span style="color:var(--sub); font-weight:400;">· ${fmtU(bar.L)}</span></div><div class="bar-container">`;
      bar.pieces.forEach((p, k) => {
        const w = p / bar.L * 100;
        d += `<div class="bar-piece" style="width:${w}%;" title="Cut ${k + 1}: ${fmtU(p)}">${w >= 9 ? fmtU(p) : ''}</div>`;
        if (k < bar.pieces.length - 1 && plan.kerfUnits > 0) d += `<div class="bar-kerf" style="width:${plan.kerfUnits / bar.L * 100}%;"></div>`;
      });
      const trailing = bar.kerfLoss - Math.max(0, bar.pieces.length - 1) * plan.kerfUnits;
      if (trailing > 0) d += `<div class="bar-kerf" style="width:${trailing / bar.L * 100}%;"></div>`;
      if (bar.offcut > 0) {
        const w = bar.offcut / bar.L * 100;
        d += `<div class="bar-waste bar-offcut${bar.reusable ? ' bar-reuse' : ''}" style="width:${w}%;">${w >= 12 ? fmtU(bar.offcut) : ''}</div>`;
      }
      d += `</div><div class="diag-meta"><b>Cut order:</b> ${groupRuns(bar.pieces, fmtU)}<br>` +
           `Offcut ${bar.offcut > 0 ? fmtU(bar.offcut) + (bar.reusable ? ' — reusable' : ' — not reusable') : 'none'} · Kerf ${fmtU(bar.kerfLoss)} · Used ${fmtU(bar.sum)}</div>`;
    });
    pageDiagram.innerHTML = d;
  }

  function glassSheetSVG(sheet, plan) {
    const W = fromUnits(plan.params.W), H = fromUnits(plan.params.H), m = fromUnits(plan.params.margin);
    const fs0 = Math.max(W, H) / 30, minFs = Math.max(W, H) / 75;
    const f = n => (Math.round(fromUnits(n) * 1000) / 1000);
    let s = `<svg viewBox="-0.5 -0.5 ${W + 1} ${H + 1}" style="width:100%; height:auto; max-height:75vh; display:block;" role="img" aria-label="Glass sheet ${sheet.index} cutting layout">`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" style="fill:var(--input); stroke:var(--text); stroke-width:${Math.max(W, H) / 400};"/>`;
    if (m > 0) s += `<rect x="${m}" y="${m}" width="${W - 2 * m}" height="${H - 2 * m}" style="fill:none; stroke:var(--sub); stroke-dasharray:${fs0 / 3} ${fs0 / 3}; stroke-width:${Math.max(W, H) / 600};"/>`;
    sheet.offcuts.forEach(o => {
      const x = f(o.x), y = f(o.y), w = f(o.w), h = f(o.h);
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:${o.reusable ? 'var(--success)' : 'none'}; fill-opacity:0.22; stroke:${o.reusable ? 'var(--success)' : 'var(--danger)'}; stroke-dasharray:${fs0 / 4} ${fs0 / 4}; stroke-width:${Math.max(W, H) / 500};"/>`;
      if (o.reusable) {
        const txt = shortLen(w) + '×' + shortLen(h);
        const fs = Math.min(fs0 * 0.8, w / (txt.length * 0.62), h / 2);
        if (fs >= minFs) s += `<text x="${x + w / 2}" y="${y + h / 2}" text-anchor="middle" dominant-baseline="central" style="font-size:${fs}px; fill:var(--text);">${txt}</text>`;
      }
    });
    sheet.placements.forEach(p => {
      const x = f(p.x), y = f(p.y), w = f(p.w), h = f(p.h);
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:var(--accent); stroke:var(--bg); stroke-width:${Math.max(W, H) / 500};"><title>${p.label}: ${fmtU(p.w)} × ${fmtU(p.h)}${p.rotated ? ' (rotated 90°)' : ''}</title></rect>`;
      const l1 = p.label + (p.rotated ? ' ↻' : ''), l2 = shortLen(w) + '×' + shortLen(h);
      const fs = Math.min(fs0, w / (Math.max(l1.length, l2.length) * 0.62), h / 3.2);
      if (fs >= minFs) {
        s += `<text text-anchor="middle" dominant-baseline="central" style="font-size:${fs}px; fill:var(--accentText); font-weight:600;"><tspan x="${x + w / 2}" y="${y + h / 2 - fs * 0.6}">${l1}</tspan><tspan x="${x + w / 2}" y="${y + h / 2 + fs * 0.65}" style="font-weight:400;">${l2}</tspan></text>`;
      } else if (Math.min(w / (l1.length * 0.62), h / 1.4) >= minFs) {
        const fs1 = Math.min(fs0, w / (l1.length * 0.62), h / 1.4);
        s += `<text x="${x + w / 2}" y="${y + h / 2}" text-anchor="middle" dominant-baseline="central" style="font-size:${fs1}px; fill:var(--accentText); font-weight:600;">${l1}</text>`;
      }
    });
    return s + '</svg>';
  }

  function renderGlassDetail() {
    const pageList = document.getElementById('page-list'), pageDiagram = document.getElementById('page-diagram');
    const entry = calculatedPlans.glass;
    const pieces = calculatedProfileData['Glass'] || [];
    if (!entry || !entry.plan) {
      let h = `<div class="diag-meta">Total Glass Panels: ${pieces.length}</div>`;
      h += `<div class="diag-warn">⚠ No sheet plan: set a valid Glass Sheet Width and Height in Settings.</div>`;
      pageList.innerHTML = h; pageDiagram.innerHTML = '<div class="diag-meta">No glass cutting plan available.</div>'; return;
    }
    const { plan, billing, costingQtyNote } = entry;
    const T = plan.totals || { sheetCount: 0, sheetArea: 0, usedArea: 0, leftover: 0, reusableArea: 0, reusableCount: 0, unusableArea: 0, utilization: 0, leftoverPct: 0, wastePct: 0 };
    let html = '';
    glassProblems(plan).forEach(m => { html += `<div class="diag-warn">⚠ ${m}</div>`; });
    html += `<div class="diag-meta">${glassStatusText(plan)}</div>`;
    html += metricRows([
      ['Required glass area', fmtArea(T.usedArea) + ` (${plan.sheets.reduce((a, s) => a + s.placements.length, 0)} pcs)`],
      ['Physical sheets cut', `${T.sheetCount} × ${fmtU(plan.params.W)} × ${fmtU(plan.params.H)}`],
      ['Stock area consumed', fmtArea(T.sheetArea)],
      ['Utilization', fmtPct(T.utilization)],
      ['Leftover (all)', `${fmtArea(T.leftover)} (${fmtPct(T.leftoverPct)})`],
      ['  reusable offcuts', `${fmtArea(T.reusableArea)} (${T.reusableCount} pc)`],
      ['  unusable (kerf, margin, small bits)', `${fmtArea(T.unusableArea)} (${fmtPct(T.wastePct)})`],
      ['Billing quantity (costing rule)', billing + ' sheet(s)']
    ]);
    html += `<div style="margin:12px 0 4px; font-size:12px; color:var(--sub);">Required glass:</div>`;
    plan.types.forEach(t => {
      html += `<div class="list-item-row"><span>${t.label} · ${fmtU(t.w)} × ${fmtU(t.h)}${t.canRotate ? '' : ' (no rotation)'}</span><span style="color:var(--accent); font-weight:600;">${t.qty} pcs</span></div>`;
    });
    pageList.innerHTML = html;

    let d = `<div class="diag-meta">Cutting layouts — ${plan.sheets.length} sheet(s). Layouts use straight edge-to-edge cuts. ↻ = rotated 90°. Green = reusable offcut, red dashed = unusable leftover.</div>`;
    plan.sheets.forEach(sheet => {
      const st = sheet.stats;
      d += `<div style="font-size:12px; margin-top:12px; color:var(--text); font-weight:600;">Sheet #${sheet.index} <span style="color:var(--sub); font-weight:400;">· ${fmtU(plan.params.W)} × ${fmtU(plan.params.H)}</span></div>`;
      d += glassSheetSVG(sheet, plan);
      const byLabel = {};
      sheet.placements.forEach(p => {
        const k = p.label; byLabel[k] = byLabel[k] || { n: 0, r: 0, w: p.w, h: p.h };
        byLabel[k].n++; if (p.rotated) byLabel[k].r++;
      });
      const tw = plan.types;
      const parts = Object.keys(byLabel).map(k => { const t = tw.find(x => x.label === k); return `${k} ${fmtU(t.w)}×${fmtU(t.h)} ×${byLabel[k].n}${byLabel[k].r ? ' (' + byLabel[k].r + ' rotated)' : ''}`; });
      d += `<div class="diag-meta">${parts.join(' · ')}</div>`;
      const offs = sheet.offcuts.filter(o => o.reusable).map(o => fmtU(o.w) + '×' + fmtU(o.h));
      d += `<div class="diag-meta">Used ${fmtArea(st.usedArea)} (${fmtPct(st.utilization)}) · Leftover ${fmtArea(st.leftover)} (${fmtPct(st.leftoverPct)}) · Reusable ${fmtArea(st.reusableArea)}${offs.length ? ' [' + offs.join(', ') + ']' : ''} · Waste ${fmtPct(st.wastePct)}${plan.params.gap > 0 ? ' · Gap ' + fmtU(plan.params.gap) : ''}</div>`;
    });
    pageDiagram.innerHTML = d;
  }

  function openItemDetail(profileName) {
    document.getElementById('detail-item-title').innerText = profileName;
    if (profileName === 'Glass') renderGlassDetail(); else renderAluminiumDetail(profileName);
    document.getElementById('output-screen').classList.add('hidden');
    document.getElementById('detail-screen').classList.remove('hidden');
    switchTab(0);
  }

  function switchTab(idx) {
    const container = document.getElementById('detail-swiper');
    container.scrollTo({ left: idx * container.clientWidth, behavior: 'smooth' });
    document.getElementById('tab-btn-text').classList.toggle('active', idx === 0);
    document.getElementById('tab-btn-visual').classList.toggle('active', idx === 1);
  }

  function handleScroll() {
    const idx = Math.round(document.getElementById('detail-swiper').scrollLeft / document.getElementById('detail-swiper').clientWidth);
    document.getElementById('tab-btn-text').classList.toggle('active', idx === 0);
    document.getElementById('tab-btn-visual').classList.toggle('active', idx === 1);
  }

  function copyOpticutterFormat() {
    let rows = document.querySelectorAll('#report-body tr');
    let text = "Item\tQty\n";
    rows.forEach(row => {
      let cols = row.querySelectorAll('td');
      if (cols.length >= 2 && !row.classList.contains('section-divider')) {
        text += `${cols[0].innerText.replace(' ➔', '')}\t${cols[1].dataset.copy || cols[1].innerText}\n`;
      }
    });
    navigator.clipboard.writeText(text);
    alert('Copied to clipboard for OptiCutter!');
  }

  initThemes();
  initPricingInputs();
  addItem();
  loadPricingFromCloud();
</script>

</body>
